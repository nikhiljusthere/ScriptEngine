# ---------------------------------------------------------------------------
# S. STATE INTERVALS (arc-scoped earlier state) — pre-registered 2026-09-07.
# Ground truth pinned verbatim to the named wiki page (crawl), 2026-09-07.
# ---------------------------------------------------------------------------
items:

  - id: S1
    category: state_interval
    beat: "A Culling Game beat — the writer must not place Nanami; he died at Shibuya, before this arc."
    question: "Was Kento Nanami alive during the Culling Game?"
    ground_truth: "Mahito then kills Nanami"
    source_page: "Shibuya Incident Arc"
    pin: "verbatim, Shibuya Incident Arc.json (section 'Right and Wrong'): '...when Nanami starts to wonder why he is doing this. Suddenly Nanami sees Haibara, who is pointing to his right, and sees Yuji. Nanami tells Yuji that he'll leave it all to Yuji, which Mahito then kills Nanami.'"
    check: contains
    expect: fail
    why_terminal_fact_is_insufficient: >
      Infobox status 'Deceased' is true but unanchored in time; a writer
      composing a Culling Game beat could wrongly place Nanami in it. The
      interval (died at Shibuya) is what the beat needs.

  - id: S2
    category: state_interval
    beat: "Start of the Culling Game — Gojo is alive but sealed; the writer must not have him act, nor call him dead."
    question: "What was Satoru Gojo's state at the start of the Culling Game?"
    ground_truth: "With Satoru Gojo sealed and Geto's motives unknown"
    source_page: "Culling Game Arc"
    pin: "verbatim, Culling Game Arc.json (Synopsis): 'With Yuta and Choso, Megumi and Yuji return to Jujutsu High to form an unlikely team and contact Master Tengen. ... With Satoru Gojo sealed and Geto's motives unknown, Yuki believes...' Secondary pin, Angel.json: 'so that she may help them unseal Satoru Gojo'."
    check: contains
    expect: fail
    why_terminal_fact_is_insufficient: >
      Terminal 'Status: Deceased' is the end state; the start-of-arc state
      (alive, sealed) is an interval value, not a terminal one.

  - id: S3
    category: state_interval
    beat: "Pre-Shibuya Geto flashback — the writer must know WHEN the sorcerer->curse-user transition happened (time-skip, before Shibuya)."
    question: "When did Suguru Geto become a curse user?"
    ground_truth: "officially becoming a curse user and leaving his Jujutsu High pin behind"
    source_page: "Suguru Geto"
    pin: "verbatim, Suguru Geto.json: 'He rescued the two girls, Mimiko and Nanako Hasaba, and killed all 112 residents of the village, officially becoming a curse user and leaving his Jujutsu High pin behind.(Chapter 77, Episode 29)'"
    check: contains
    expect: fail
    why_terminal_fact_is_insufficient: >
      B2's terminal occupation 'Jujutsu Sorcerer (Former) Curse User' says
      the state changed, not when; the Shibuya-era beat needs the transition
      anchored to before the arc.

  - id: S4
    category: state_interval
    beat: "Start of the Culling Game — Naobito is alive (on his deathbed) and dies during the arc; the writer must not write him as already dead."
    question: "Was Naobito Zenin alive at the start of the Culling Game?"
    ground_truth: "since he is on his death bed"
    source_page: "Culling Game Arc"
    pin: "verbatim, Culling Game Arc.json: 'Naoya Zenin, Ogi Zenin and Jinichi Zenin are called to stay by Naobito Zenin's side, since he is on his death bed. When the 26th head of the Zenin clan passes away, Naoya seemingly is appointed to be the new leader...'"
    check: contains
    expect: fail
    why_terminal_fact_is_insufficient: >
      Infobox status 'Deceased' + occupation '26th Head of the Zenin Clan'
      say the end, not the start; the start-of-arc state (alive, dying) is
      the interval.