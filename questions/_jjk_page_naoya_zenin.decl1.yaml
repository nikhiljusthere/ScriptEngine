# Staged roster declarations for the Naoya Zenin page campaign
# (questions/_jjk_page_naoya_zenin.section1.json, section 1: battles).
# Merge under `rosters:` in series/jjk/overrides.yaml.
#
# The battles roster is the four battle pages listed in the `Battles & Events`
# section of `Naoya Zenin`, whose titles are reused verbatim from
# _jjk_battles.json; all four carry the `Naoya Zenin Battles` category. The
# battles-in discovery path returns an 18-member superset (it unions the
# `Maki Zenin Battles` category through the Maki-titled pages), so the set is
# declared.
#
# The ten technique rosters are the infobox `powers1`/`powers2` blocks of the
# four battle pages. Five of them (Choso / Naoya in Choso's fight, Maki / Naoya
# in Maki's fight, Naoya in the Daido & Miyo fight) already resolve by
# discovery and match the official bank (jjk-cov-13/14/32/33/38); the other
# five leak or drop members under discovery, and are declared so the declared
# roster wins (G6). Match phrases are the lowercased bank question plus one
# paraphrase each, and say `techniques`, never `arc`. Members carrying `&`
# stay quoted or YAML parses them as anchors.

rosters:
