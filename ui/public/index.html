<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6C5CE7" />
    <meta
      name="description"
      content="ScriptEngine - ordered, cited knowledge from Fandom wikis"
    />
    <!--
      Browser fallback. Opening http://localhost:3000 directly, outside Electron,
      leaves window.electron undefined and every page crashes on first render.

      This shim keeps the UI navigable in a browser, but it deliberately reports
      that nothing is connected rather than inventing results. It previously
      returned fabricated search hits ("Naruto", "One Piece") and a fake
      generated script, which looks exactly like a working app and is worse than
      an honest error.
    -->
    <script>
      (function () {
        if (window.electron) return;

        const unavailable = (channel) => {
          throw new Error(
            channel +
              " needs the desktop app. Run `npm run dev` instead of opening " +
              "localhost:3000, and start the API with " +
              "`python -m scriptengine.api.main`."
          );
        };

        window.electron = {
          ipcRenderer: {
            invoke: async (channel) => {
              // Health is the one channel with a truthful browser answer:
              // there is no API connection from here.
              if (channel === "health-check") {
                return { status: null, device: null, version: null, series: [] };
              }
              return unavailable(channel);
            },
            on: () => {},
            removeAllListeners: () => {},
          },
          healthCheck: async () => ({ status: null, series: [] }),
          crawlSeries: async () => unavailable("crawl-series"),
          stopCrawl: async () => ({ success: true }),
          checkSeriesExists: async () => ({ exists: false }),
          listSeries: async () => unavailable("list-series"),
          search: async () => unavailable("search"),
          getContext: async () => unavailable("get-context"),
          getTimeline: async () => unavailable("get-timeline"),
          getFacts: async () => unavailable("get-facts"),
          onCrawlProgress: () => () => {},
          removeCrawlProgressListeners: () => {},
        };
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>ScriptEngine</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
