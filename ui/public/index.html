<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#6C5CE7" />
    <meta
      name="description"
      content="Anime Script AI - Generate YouTube scripts from anime content"
    />
    <!-- Electron IPC Polyfill for standalone browser usage -->
    <script>
      (function() {
        if (!window.electron) {
          window.electron = {
            ipcRenderer: {
              invoke: async (channel, args) => {
                const methods = {
                  'run-setup': () => ({ success: true }),
                  'health-check': () => ({ status: 'ok', services: {} }),
                  'start-services': () => ({ success: true }),
                  'stop-services': () => ({ success: true }),
                  'crawl-series': () => {
                    throw new Error(
                      'crawl-series requires Electron. Start the desktop app, not npm start.'
                    );
                  },
                  'ingest-document': (data) => ({ chunks_created: 10, message: 'Demo mode' }),
                  'generate-script': (data) => ({ 
                    script_text: '# Demo Script\n\nThis is a demo script generated in browser mode.\n\n## Introduction\n\nWelcome to Anime Script AI!\n\n## Main Content\n\nHere you would find the full documentary-style script with citations and references.\n\n## Conclusion\n\nThanks for watching!',
                    citations: [],
                    quality_score: 0.85,
                    fact_check_score: 0.92
                  }),
                  'search': (data) => ({ 
                    results: [
                      { series: 'Naruto', content: 'Sample search result...', score: 0.9 },
                      { series: 'One Piece', content: 'Another sample result...', score: 0.85 }
                    ]
                  })
                };
                if (methods[channel]) {
                  return await methods[channel](args);
                }
                throw new Error('Unknown channel: ' + channel);
              },
              on: (channel, callback) => {},
              removeAllListeners: () => {}
            }
          };
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Anime Script AI</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
