# Per-wiki handling for the Marvel Cinematic Universe Wiki
# (marvelcinematicuniverse.fandom.com).
#
# Infoboxes are plain `Template:` templates without the word "infobox" in
# their names (measured 2026-09-25: 489 templates; the only "infobox"-named
# entries are `InfoboxWP` and `Infobox List`). Without these aliases every
# page stores as `unknown` with zero facts (plan MARVEL_100_PLAN.md §1, L1).
#
# The per-series navigation templates (`Hawkeye Series`, `Loki Series`,
# `AOS Series`, ...) are nav boxes, not subject types, so they are
# deliberately NOT typed; `type_for_templates` prefers the richest known
# infobox, which is what these pages actually lead with.

type_aliases:
  "Character": character
  "Movie": movie
  "Episode": episode
  "Event": event
  "Item": item
  "Location": location
  "Organization": organization
  "Concept": concept
  "Media": media
  "Comic": comic
  "Filmmaker": filmmaker
  "TV": tv_series
  # `Template:Series` does not exist on this wiki (pageid 0, checked
  # 2026-09-25); TV series use `Template:TV` (WandaVision, Loki, What If...?,
  # X-Men '97 all carry it — verified 2026-09-25).

# 100% scope (2026-09-29, architect): the MediaWiki default skip patterns
# "images", "stubs", "browse" and "wiki" match CONTENT categories on this wiki
# ("Articles with No Applicable Images", "Article stubs"): a stub is a short
# article, still lines of the corpus. They caused the delta found at MCU shard 1
# (mcu 3,672 / marvel 19,532 plain article titles enumerated, never fetched).
# Kept: the genuinely non-content filters.
skip_patterns:
  - gallery
  - galleries
  - candidates for deletion
  - disambiguation
  - blog posts
  - site maintenance
  - templates
skip_categories: []

# C1 (plan MARVEL_100_PLAN.md §4): per-wiki identity-field map (fix class R-7,
# config.identity_fields). The character infobox (`Template:Character`) keys
# are measured 2026-09-27 from the G6 final extract (33,686 character pages);
# `status`/`gender`/`age`/`citizenship`/`height`/`weight` already sit in the
# shared engine dict. `alias`/`affiliation` take the roster path
# (LIST_FIELDS). Deliberately NOT here: `name` (the subject), the three
# one-off wiki typos `affilitation`/`affiliatoion`/`voice acrtor` (1 page
# each -- data-quality residue, recorded in known_diffs, not a mapping), and
# `idno`'s sibling maintenance keys.
identity_fields:
  species: "What is {name}'s species?"
  real name: "What is {name}'s real name?"
  tv series: "In which TV series does {name} appear?"
  movie: "In which movie does {name} first appear?"
  comic: "In which comic does {name} appear?"
  actor: "Who portrays {name}?"
  voice actor: "Who is {name}'s voice actor?"
  title: "What is {name}'s title?"
  dob: "When was {name} born?"
  dod: "When does {name} die?"
  snapped: "What is {name}'s status after the Snap?"
  clearance: "What is {name}'s security clearance?"
  citizenship: "What is {name}'s citizenship?"
  game: "In which game does {name} appear?"
  book: "In which book does {name} appear?"
  web series: "In which web series does {name} appear?"
  docuseries: "In which documentary series does {name} appear?"
  tv movie: "In which TV movie does {name} appear?"
  oneshot: "In which one-shot does {name} appear?"
  theme park: "In which theme park does {name} appear?"
  idno: "What is {name}'s ID number?"

# C2 (plan MARVEL_100_PLAN.md §4, L5): category -> relation grammar. The
# plan's four patterns are Marvel-DB conventions and hit zero on this wiki,
# which embeds the target in the category name instead (measured 2026-09-27
# against the store's 155,189 category rows): `X Crew Members` names the
# production the crew member belongs to (8,356 docs; 105 of 119 distinct
# targets resolve to nodes, the rest are skipped and counted, never
# invented). `Episodes` (717 docs), `Soundtrack` (2,088) and
# `Interviewees` (626) are mechanism-ready but their mapping is deferred:
# the edge direction is a per-wiki judgment, recorded in
# known_diffs_2026-09-25.md rather than guessed here.
category_relations:
  - {pattern: "^(.+) Crew Members$", relation: crew_of, target: 1}

# Chunk containment (plan MARVEL_100_PLAN.md §4, gate C): same divergence as
# the Marvel DB -- the oracle counts the trivia under `References` / `Notes`
# / `Gallery` (138 sentences in 104 documents unreachable on the 2026-09-27
# tier-0 run: References 98, Notes 38, Gallery 2), but the engine default
# skips those sections. Promoted to content; text-free sections still die in
# the chunker's `word_count == 0` guard.
content_sections:
  - references
  - notes
  - gallery
# Same rationale as the marvel override (see there): the JJK-era guard bans
# the route keywords "arc"/"saga" in roster match phrases, but the router
# only routes on `arc` where the wiki records `arc` facts and mcu records
# none, so the ban is a false positive. Measured 2026-09-27: exactly 1 of
# 4,804 tier-a character titles would trip it, and that one (the item page
# "Justin Hammer/Artificial Heart Arc Reactor") is not in the tier-a
# population -- which is why the 100%-complete MCU sweep finished with 0
# errors. Declared here so a later tier-b sweep (non-characters) hits the
# same clean path.
roster_route_words: []
# C4 events (2026-09-28): this wiki's battle pages are `conflict` (870 pages,
# Background/Battle/Aftermath sections), outside the engine's default
# placement set (arc/saga/event/battle/story_arcs).
# R3 axis steer (2026-09-28): conflict / war / event are one axis on this
# wiki -- the engine default already carries `event`; `war` (99 pages) is the
# gap, so all three are declared so the store axis and the placement queue
# walk the same set.
events:
  # Council step 1 (2026-09-29, reports/marvel/SCHEMA_TEST_who_would_win_2026-09-29.md):
  # the shared verb set records that a fight happened, not who won; 0 of 30
  # "who would win" questions were answerable from its rows, while 8.7% of
  # Marvel history sentences state an outcome. The outcome verbs this wiki's
  # rows may use: `defeated` (subject beat object; "Y lost to X" is written
  # X defeated Y), `escaped` (subject got away from object), `captured`
  # (subject captured / subdued / imprisoned object). `fought` stays for a
  # fight whose outcome the passage does not state.
  extra_verbs: [defeated, escaped, captured]
  placement_types: [conflict, war, event]
  # R3 (2026-09-28 architect steer): this wiki's declared time axis. The
  # episode instalments chain into runs through their own `previous` / `next`
  # facts (the chain walk reads `previous` backwards, value -> page), and the
  # pages the chain leaves sit at the clock their `date` fact parses to.
  # The store axis (timeaxis.store_time_axis) places its placement pages by
  # these, strongest first; the run's receipt is its tally.
  axis:
    date_keys: [date]
    chain_keys: [previous, next]
  # P5 (2026-09-28 architect steer): the wiki's `Hub:` index pages (1,499
  # nodes) are apparatus, never event participants -- a bare name that folds
  # over one (`'Hub:Thanos | Thanos | ...'`) must resolve to the character
  # page, and the 252 rows filed on hubs re-resolve under the prefix-
  # stripped name. Declared here, not engine-wide: which pages are
  # apparatus is a wiki decision (the marvel store carries no `Hub:`
  # nodes at all).
  participant_excludes:
    - "Hub:"

# P2 (2026-09-28): `Infobox List` is the wiki's collapsible list wrapper,
# nested inside the subject infoboxes (it renders the `tv series` /
# `appearances` lists inside `Template:Character` et al.), not a subject
# type. Its name is longer than every subject template, so the
# longest-name rule in `type_for_templates` shadowed 430 main pages
# (Thanos, Gamora, Iron Man; 3.04 M words; 3,656/6,108 event rows touch
# them) as `list`. Declaring it structural restores each page's subject
# type (census 2026-09-28: 302 character, 53 war, 17 location, 15
# organization, 12 item, 6 filmmaker, 6 race, 6 concept, 5 project, 5
# armor, 2 vehicle, 1 event; zero fall to unknown). `InfoboxWP` — the
# other "infobox"-named entry — is declared alongside: a wiki-port
# wrapper, types zero pages today, and the declaration keeps it from
# shadowing later.
structural_infoboxes:
  - "Infobox List"
  - "InfoboxWP"

# P2b (2026-09-28): the live wiki's `Tony Stark` page (pageid 26303) is
# `#REDIRECT [[Iron Man]]`, and redirects are followed, not crawled: the
# corpus holds `Iron Man`, never the redirect. Every edge and chunk entity
# written under the bare name therefore forked a stub node (store census
# 2026-09-28: node 35256, 2,997 in-edges, 13,304 chunk links; the Iron Man
# page itself holds the `tony stark` alias, so the two nodes are one entity
# split across a redirect). This pin resolves the bare name to the character
# page and is the ONLY merge the mcu build applies: the engine's generic
# evidence-based inference is gated behind a per-wiki `alias_merge: true`
# declaration (default off -- the P2b merge census 2026-09-28 found it fires
# on every wiki, e.g. 1,203 names in jjk, several of them wrong such as db's
# `funimation` -> Crunchyroll, so no wiki infers unless it declares it).
# The census found 5,870 inferred candidates in mcu (34,764 edges); to adopt
# them the wiki would add `alias_merge: true` next to this pin (deliberately
# not done: the mcu build applies the pin only). The store changes only via
# re-index after the gates; no direct surgery.
alias_map:
  "Tony Stark": "Iron Man"
