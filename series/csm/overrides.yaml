# Per-wiki handling for the Chainsaw Man wiki.

# Chainsaw Man writes every reference positionally, with no named parameters at
# all:
#
#     {{Ref|m|216|3-4}}     manga, chapter 216, pages 3-4
#     {{Ref|a|12|1}}        anime, episode 12
#
# The first argument picks the medium and the second holds the number. Before
# this mapping existed, all 2,946 references on the wiki rendered as nothing and
# the series scored 0.0% sourced prose.
citation_positional:
  select: 0
  number: 1
  mediums:
    m: {as: chapter}
    a: {as: episode}

# Engine-default boilerplate this wiki treats as content. The chunker skips
# `notes` and `references` MediaWiki-wide, but on this wiki both carry
# substance the span-recall oracle counts, and the divergence was the last 17
# unreachable lines of the 439-line wave-0 miss file (2026-09-07, 537-page
# corpus, 97.45% tier-0):
#
#   * `Notes` (8 non-empty sections, all on episode pages) holds the
#     anime-vs-manga diff notes -- "This was not featured in the manga.",
#     "In the anime, the puke that Himeno vomited in Denji's mouth is
#     censored." -- which is exactly the kind of line a script question asks
#     about. 16 miss lines.
#   * `References` (2 non-empty sections) holds the page's alias blocks the
#     crawler files there ("Chainsaw Man (Anime) / (anime) / (Аниме)") -- the
#     multilingual names are queryable content, not footnotes. 1 miss line
#     (the other holds a 3-word line below the oracle's 6-word floor).
#
# D5 floor decision (2026-09-08, CSM-3; council ruling 4b: decide BEFORE
# panel pinning): the <6-word line floor is a declared measurement boundary,
# not a silent scope -- the sub-floor lines are list-shaped rows (chapter/
# volume/episode lists, arc lists, 44 Summary + 99 poll rows; section
# histogram in reports/csm/floor_census_csm.md) that carry too little
# signal to query with, and their misses would be ranking noise, not
# reachability defects.
# Census on the current tree: 775 sub-6-word lines in non-boilerplate
# sections, all tier-0-eligible (whole inside a chunk); all are excluded
# from the pinned D5 panel (17,381 unique rows = 17,181 sweep + 200
# held-out; 17,382 is the tier-0 *occurrence* count -- one line duplicates
# inside its section, COUNCIL_csm-3 clash 5), which records the floor
# (min_words) in its metadata: reports/csm/panel_csm.json.
#
# Subtracted from the chunker's skip set by
# `effective_boilerplate_sections`; empty sections still die in the
# `word_count == 0` guard (the JJK References precedent).
content_sections:
  - Notes
  - References

# The sets this wiki maintains, declared so an enumeration topic resolves the
# same way every time instead of being scored against category names at query
# time. Anything not declared here still goes through discovery.
# Denji's forms are headings under `Appearance` (Hybrid Form, Devil Form,
# Combined Form) because this wiki gives them no pages and records no `users`
# field on anything. Asked for his forms, the engine answered with five other
# characters' devil transformations.
ability_sections:
  transformation: [Appearance]
  technique: [Abilities]

# What this wiki calls a kind of ability. A devil hunter's power *is* their
# contract, so "Every devil contract of Aki Hayakawa" is a question about what
# Aki can do, but `contract` matched no kind word, and `devil` is a declared
# set, so the topic resolved to the wiki's devils instead of to Aki.
ability_kinds:
  technique: [contract, contracts]

# G-CSM-3 (2026-09-09, red list R-4): the door scopes each question to its own
# shape. Both knobs below are read by series-agnostic engine code; a wiki that
# declares neither answers exactly as before.
#
# Umbrella questions ("Every ability of X") read only this section's tree on
# their section pass. This wiki files a character's forms under `Appearance`,
# and the bank's ability gold carries no form heading (csm-set-02, csm-char-02,
# csm-char-03), so `Appearance`'s form headings stop diluting an ability
# answer. Explicit-kind questions still use the per-kind `ability_sections`
# map above, and the extracted pass is untouched: csm-char-01's gold includes
# Denji's two transformation *rows*, and umbrella questions keep them.
ability_sections_umbrella: [Abilities]

# An explicit-kind question reads a kind's extracted rows only from the
# sections this wiki files that kind under. Denji's `Hybrid Transformation`
# and `Devil Transformation` rows are prose under `Abilities / Hybrid Powers`,
# so "Every form of Denji" (csm-set-01) reads forms from `Appearance` only --
# his five form headings -- while the two prose rows stay answers to his
# abilities (csm-char-01), not to his forms.
ability_row_sections:
  transformation: [Appearance]

rosters:

  # The Public Safety special divisions
  # Declared 2026-08-15: the engine resolved `How many special divisions exist in
  # Public Safety Devil Hunters?` to the basis `Devil Hunters`, a category of
  # *people*, and returned 72 intruders at 3% precision -- one question carrying
  # 12% of every intruder left in the bank. A question about divisions must not
  # answer with devil hunters.
  #
  # Members are every division the wiki names as one, counted over all csm
  # chunks: Division 5 (84 mentions, 17 pages), 4 (82/27), 7 (54/21), 6 (20/6),
  # 1 (8/3). Only 4 and 5 have their own page; the rest exist in prose only, and
  # `_declared_members` keeps pageless members deliberately.
  #
  # The bank's gold for this question lists only 4 and 5 and is wrong: its note
  # reads "two special divisions mentioned" and its one source is the `Makima`
  # page, so it counted what one page mentions rather than what exists. The wiki
  # never states a total -- a `Division 2 Vice Captain` page implies a Division 2
  # that is never named as one -- so the count is not answerable from this
  # corpus. Left declared rather than retired because retiring deletes, and
  # returning five divisions beats returning seventy-two people either way.
  - name: The Public Safety special divisions
    match:
      - special divisions
      - how many special divisions
      - special divisions public safety
      - public safety special divisions
      - special divisions exist in public safety devil hunters
    members: [Tokyo Special Division 1, Tokyo Special Division 4, Tokyo Special Division 5, Tokyo Special Division 6, Tokyo Special Division 7]

  # Every devil contract Denji has made
  # Declared 2026-08-15: the engine resolved this to `Listed in the Devil Contracts section on the Denji page` and returned the wrong set. Members transcribed from `Denji`.
  - name: Every devil contract Denji has made
    match:
      - every devil contract denji has made
      - devil contract denji has made
    subject: Denji
    members: [Chainsaw Devil Contract, Blood Devil Contract, Aging Devil Contract]

  # Every blood weapon Power can create
  # Declared 2026-08-15: the engine resolved this to `Listed in the Blood Manipulation section on the Power page` and returned the wrong set. Members transcribed from `Power`.
  - name: Every blood weapon Power can create
    match:
      - every blood weapon power can create
      - blood weapon power can create
    subject: Power
    members: [Blood Hammer, Blood Knife, Blood Spear, Blood Scythe, Blood Dagger, Blood Axe, Blood Chainsaw]

  # Every devil Aki Hayakawa contracted with
  # Declared 2026-08-15: the engine resolved this to `Listed in the infobox contracted devils field on the Aki Hayakawa page` and returned the wrong set. Members transcribed from `Aki Hayakawa`.
  - name: Every devil Aki Hayakawa contracted with
    match:
      - every devil aki hayakawa contracted with
      - devil aki hayakawa contracted with
    subject: Aki Hayakawa
    members: [Fox Devil, Curse Devil, Future Devil, Control Devil]

  # Every devil whose power Makima can channel through her control ability
  # Declared 2026-08-15: the engine resolved this to `Listed in the Control ability description on the Makima page` and returned the wrong set. Members transcribed from `Makima`.
  - name: Every devil whose power Makima can channel through her control ability
    match:
      - every devil whose power makima can channel through her control ability
      - devil whose power makima can channel through her control ability
    subject: Makima
    members: [Angel Devil, Future Devil, Snake Devil, Punishment Devil, Spider Devil, Zombie Devil]

  # Every division Himeno was affiliated with in Public Safety
  # Declared 2026-08-15: the engine resolved this to `Listed in the infobox affiliation field on the Himeno page` and returned the wrong set. Members transcribed from `Himeno`.
  - name: Every division Himeno was affiliated with in Public Safety
    match:
      - every division himeno was affiliated with in public safety
      - division himeno was affiliated with in public safety
    subject: Himeno
    members: [Tokyo Special Division 4]

  # How many members are in the Four Horsemen?
  # Declared 2026-08-15: the engine resolved this to `Listed in the infobox notable_members field and Members section on the Four Horsemen page` and returned the wrong set. Members transcribed from `Four Horsemen`.
  - name: How many members are in the Four Horsemen
    match:
      - how many members are in the four horsemen
      - members are in the four horsemen
    subject: Four Horsemen
    members: [Control Devil, War Devil, Famine Devil, Death Devil]
  # Every member carries `affiliation = Tokyo Special Division 4` on their own
  # page, which is an edge the wiki wrote and the roster path does not follow --
  # `affiliation` is not one of the seven names in `_BELONGS_RELATIONS`. The
  # question scored 0/14 with the answer sitting in the store the whole time.
  #
  # `Angel Devil` is the page title; the bank lists the member as `Angel` and
  # already carries `angel devil` as an alias, so the page name is what belongs
  # here. The two generic `Division 4 Male/Female Member` pages are left out.
  - name: Tokyo Special Division 4
    match: [tokyo special division 4, special division 4, public safety division 4,
            division 4]
    members: [Makima, Kishibe, Denji, Aki Hayakawa, Power, Himeno,
              Kobeni Higashiyama, Hirokazu Arai, Angel Devil, Beam, Galgali,
              Princi, Fushi, Madoka]
    # G-CSM-3 (csm-set-17 vs csm-set-08): the wiki's Members section is the
    # closed Part-1 membership (seven humans); `members:` above is the full
    # named roster, later-arc fiends included. A plain "members of" question
    # serves the closed seven; "named member" asks for the full list and keeps
    # all fourteen.
    closed_members: [Makima, Aki Hayakawa, Denji, Power, Himeno,
                     Kobeni Higashiyama, Hirokazu Arai]

  # "Every Weapon Devil" resolved to the whole `Devils` category and returned 88
  # members for 7 canon items -- the worst precision in the run, and 0% recall
  # with it. The wiki keeps the set on one page, but its Members gallery links
  # to the *human* each devil later fused with, so these are the page titles:
  # Katana Man is the Katana Devil, Reze the Bomb Devil, and so on. The bank
  # already aliases five of the seven that way; `Whip Hybrid` and `Spear Hybrid`
  # needed the alias adding.
  - name: Weapon Devils
    match: [weapon devil, weapon devils]
    members: [Katana Man, Reze, Quanxi, Miri Sugo, Barem Bridge, Whip Hybrid,
              Spear Hybrid]

  # Aki's three contracts are stored, as `Fox Devil Contract`, `Curse Devil
  # Contract` and `Future Devil Contract` under
  # `Abilities / Antemortem Abilities / Devil Contracts`, and all three are
  # filed `kind=transformation`. "Every devil contract of Aki Hayakawa" does not
  # use an umbrella word, so it asks for techniques alone and got the four
  # technique rows on the same page instead -- Precognition, Summoning, Bullet
  # Projection, Blood Consumption. Named here against the devil pages, which is
  # how the bank names them and what the wiki links.
  - name: Aki Hayakawa's devil contracts
    match: [devil contract of aki hayakawa, devil contracts of aki hayakawa,
            contract of aki hayakawa, contracts of aki hayakawa]
    subject: Aki Hayakawa
    members: [Fox Devil, Curse Devil, Future Devil]

  # Nothing at all was extracted for Himeno -- her `abilities` table is empty --
  # so the character path could only return the headings `Past` and `Devil
  # Contract`. Both members are named on her page and neither has an article:
  # "'''Ghost Devil Contract''': Himeno had the ability to use the power of the
  # Ghost Devil".
  - name: Himeno's abilities
    match: [ability of himeno, abilities of himeno]
    subject: Himeno
    members: [Ghost Devil Contract, Hand-to-Hand Combat]

  # No `group_by: species` here on purpose: every member of this category
  # answers "Devil", so grouping by it produces one group and says nothing.
  - name: Devils
    match: [devil, devils]
    category: Devils

  - name: Devil Hunters
    match: [devil hunter, devil hunters, hunter]
    category: Devil Hunters

  - name: Hybrids
    match: [hybrid, hybrids]
    category: Hybrids

  - name: Fiends
    match: [fiend, fiends]
    category: Fiends

  - name: Humans
    match: [human, humans]
    category: Humans

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Four Horsemen and the Primal Fear devils are the two tiers this series
  # actually distinguishes; the rest of the devils are flat.
  - name: Four Horsemen
    match: [four horsemen, horseman, horsemen]
    category: Four Horsemen

  - name: Primal Fear Devils
    match: [primal, primal fear, primal devil, primal devils]
    category: Primal Fear

  - name: Devil Tiers
    match: [devil tier, devil tiers, tier of devil, kind of devil, kinds of devil]
    groups:
      Primal Fear: Primal Fear
      Four Horsemen: Four Horsemen
      Devils: Devils
      Fiends: Fiends
      Hybrids: Hybrids

  - name: Groups
    match: [group, groups, organisation, organization, organizations]
    category: Groups

# Section labels that kept arriving as members. A heading is where an
# ability is described, never one itself, and `_drop_templates` only
# removes headings shared by ten or more pages -- these sit under that on
# this wiki. Checked against every item and alias in this series' bank.
ability_stopwords:
  - Physical Abilities
  - Other Abilities
  - Supernatural Abilities
  - Antemortem Abilities
  - Postmortem Abilities

# Where this wiki keeps its relationships.
#
# The defaults, `Relationships` and `History`, reach 34 of this wiki's 155
# characters. Chainsaw Man writes its story under `Plot` on the character page
# and `Synopsis` on the `<Character>/History` subpage: 382,033 characters of
# prose on character pages against 144,513 for `Relationships`. Berserk, whose
# story sections *are* declared, reaches 114 characters against csm's 34, and
# that gap is this declaration.
#
# Declared 2026-08-17, and kept on measurement rather than on the argument.
# 1,226 windows, 31.6 minutes.
#
#   documented partners held   51/52 -> 51/52  (98.1%, unchanged, none lost)
#   characters with relations     30 -> 108
#   rows                         492 -> 748    (Plot contributes 264)
#   outside the closed vocabulary  0 -> 0      empty quotes 0 -> 0
#
# Measured by `scriptengine.eval.relation_coverage` against
# `questions/_csm_relations.json`, which exists because nothing else scores
# this table: the canon bank has no relation-shaped set question on any wiki
# and `build_roster` never reads relations.
#
# The playbook's warning is real and this is what it costs. Judged by whether
# the stored quote names both parties, `Plot` rows are the *best* grounded of
# the three sources, not the worst:
#
#                    rows   quote names both   names neither   co-presence only
#   Relationships      98         20%               27%              1%
#   Synopsis          365         30%               21%              4%
#   Plot              264         42%               15%              9%
#
# So declaring `Plot` is not a new risk; it extends a source this wiki was
# already reading -- `<Character>/History` pages carry `Synopsis` breadcrumbs
# and matched by title leaf, which is why 390 of the 492 rows here were already
# narration before this line existed. Rejecting `Plot` on quality grounds would
# argue for dropping `Synopsis` too, and with it 650 of the 748 rows.
#
# The one real weakness is shared, not Plot's: 9% of its rows rest on a quote
# that only places two characters in the same scene ("Nomo is first seen at the
# Training Facility, with Aki Hayakawa and others" -> ally). The prompt already
# forbids exactly that and is ignored, so it is a prompt problem across every
# narration source rather than a reason to leave this section undeclared.
#
# jjk (`Synopsis`, 22 of 25 characters held) and opm (`Plot`, 88 of 144) have
# the same shape and are the next candidates. db needs nothing: it declares
# `Biography` already and holds 801 of 1,057.
relation_sections: [Relationships, History, Plot, Synopsis]

# Abilities a wiki only shows happening: REFUTED 2026-08-17, do not re-declare.
#
# `ability_narrative_types` read chapter and episode pages instead of character
# pages. It was built for two Chainsaw Man gold items and measured on csm, the
# cheapest wiki that holds them: 904 passages, 927 windows, 37 rows.
#
#   csm recall     144/146 (98.6%) -> 144/146 (98.6%)   no item recovered
#   csm precision            80.4% ->          74.5%    +28 members returned
#
# It cost 5.9 points of precision and recovered nothing, so the rows were
# deleted and every declaration removed. Three separate reasons, any one of
# which is enough:
#
# * **Both motivating items are somewhere else.** Makima's Prime Minister
#   contract is on her own page under a declared `Abilities` section, where the
#   model correctly answers `{"abilities": []}` because the wiki never names
#   the contract -- `Prime Minister Contract` is the bank's coinage. Power's
#   blood weapons are on `Power/History`, a page type this never read.
# * **A story summary names the wrong things.** Chapter summaries gave Denji
#   six namings of one transformation (`Chainsaw`, `Chainsaw form`,
#   `Chainsaw Devil`, `Chainsaw Man`, `Denji Man`, and `Denji` itself), which
#   is what took `Every form of Denji` from 57.1% to 28.6% precision.
# * **Attribution is not safe in narration.** `Blood weapons` was stored
#   against Makima, from a passage that names her while describing Power's.
#
# The pass itself stays in the tree, tested and working: it is one line of YAML
# from being live if a wiki is ever found whose abilities genuinely exist only
# in its story pages. Chainsaw Man is not that wiki, and it was chosen as the
# best case.

# ── CSM-2 (2026-09-08): campaign scope + archetypes (council item 2) ─────────
# The per-type campaign scope — the 5.1 scope list and the §6 archetype
# mapping, one artifact. `tools/coverage_report.py` reads this; a page_type
# not classified below exits non-zero (silence must become an error).
# In-scope = authorable prose the campaign must cover; media / nav / release
# pages are out of scope (JJK precedent, the coverage report's paragraph).
page_scope:
  character:
    in_scope: true
    archetype: character
  character_history:
    in_scope: true
    archetype: character
  episode:
    in_scope: true
    archetype: episode
  organization:
    in_scope: true
    archetype: organisation
  establishment:
    in_scope: true
    archetype: organisation
  chapter_box:
    in_scope: false
    archetype: chapter
    reason: "Manga chapter nav/summary box (nav page)"
  volume_box:
    in_scope: false
    archetype: release
    reason: "Manga volume release page (media)"
  story_arcs_box:
    in_scope: false
    archetype: chapter
    reason: "Arc-grouping nav box; the arc content sits on the chapter pages"
  saga_box:
    in_scope: false
    archetype: chapter
    reason: "Saga-grouping nav box"
  music:
    in_scope: false
    archetype: release
    reason: "Music release page (media)"
  anime:
    in_scope: false
    archetype: release
    reason: "Anime release page (media)"
  blu_ray_dvd:
    in_scope: false
    archetype: release
    reason: "Home-video release page (media)"
  unknown:
    in_scope: false
    archetype: item
    reason: "Unclassified infobox shape — every page carries its own
      disposition under `unknown_pages` below"

# The 14 pages the infobox detector filed under `unknown`, each classified or
# excluded in writing (council item 2: "the 14 unknowns classified or
# excluded in writing"). JJK precedent: the lore-content page in, the
# author / list / promo pages out.
unknown_pages:
  Contract:
    in_scope: true
    archetype: item
    reason: "Lore-content page: contract types + the occurred contracts (62 chunks)"
  Hell:
    in_scope: true
    archetype: location
    reason: "Setting page (overview / inhabitants / plot)"
  World:
    in_scope: true
    archetype: location
    reason: "Setting page: the wiki's locations, organised by country"
  Aging's World:
    in_scope: true
    archetype: location
    reason: "Setting page for the Aging Devil's world (inhabitants / plot)"
  Timeline:
    in_scope: false
    archetype: chapter
    reason: "Chronological reference list, not a single narrative page (JJK list-page precedent)"
  Story Arcs:
    in_scope: false
    archetype: chapter
    reason: "Reference index of arcs; arc content sits on the story_arcs_box / chapter pages (JJK Story Arcs precedent)"
  Popularity Polls:
    in_scope: false
    archetype: item
    reason: "Meta/reference (fan polls)"
  Tatsuki Fujimoto:
    in_scope: false
    archetype: character
    reason: "Author page (JJK author-page precedent)"
  Chainsaw Man (Manga):
    in_scope: false
    archetype: release
    reason: "Series-level overview page (the JJK `series` type is out of scope)"
  Chainsaw Man The Stage:
    in_scope: false
    archetype: release
    reason: "Stage-play release page (the JJK `stage_play` type is out of scope)"
  Chainsaw Man x BanG Dream!:
    in_scope: false
    archetype: release
    reason: "Promo/collab page"
  Chainsaw Man x Monster Strike:
    in_scope: false
    archetype: release
    reason: "Game-collab page (the JJK `game` type is out of scope)"
  Real Chainsaw Man:
    in_scope: false
    archetype: release
    reason: "Gallery/promo page (posters, making-of video)"
  Chain Run:
    in_scope: false
    archetype: release
    reason: "Game page (the JJK `game` type is out of scope)"

# The reusable archetype schema (council item 2: "defined once here,
# inherited by the other six"). `depth_floor`: the minimum number of
# non-boilerplate content sections a page of this archetype must carry to
# count as "deep enough" for D2 — declared 1 for the in-scope archetypes
# (content must exist); deeper per-archetype floors are set when the CSM-6
# census runs, never guessed here. `release` floors at 0: every CSM
# release page is excluded in writing, so nothing is measured.
archetypes:
  character:    {depth_floor: 1}
  chapter:      {depth_floor: 1}
  episode:      {depth_floor: 1}
  battle:       {depth_floor: 1}
  technique:    {depth_floor: 1}
  location:     {depth_floor: 1}
  organisation: {depth_floor: 1}
  item:         {depth_floor: 1}
  release:      {depth_floor: 0}

# The coverage report's "In-scope content remainder" paragraph, kept here so
# the tool carries no series name (literal block: the lines print verbatim).
remainder_note: |
  Content-bearing pages not yet covered (authorable prose). Nav boxes
  (chapter_box, story_arcs_box, saga_box), release pages (volume_box,
  music, anime, blu_ray_dvd) and the excluded `unknown` list/author/
  meta/release pages are out of scope.

# The narrative door resolves subjects through the wiki's `aliases` table,
# which for CSM carries only the full arc titles ("Bomb Girl arc"); the bare
# display names questions actually use resolve to nothing (miss queue
# door-nar-None x3, fix class R-6, 2026-09-10). Display name -> canonical node,
# consulted at query time by retrieve/narrative.py (config.subject_aliases):
# no reindex.
subject_aliases:
  Introduction: Introduction arc
  Bomb Girl: Bomb Girl arc
  International Assassins: International Assassins arc

# The page-sweep identity builder (eval/page_gen.py) matches infobox fact
# keys against the shared engine vocabulary; 61 CSM keys sit outside it and
# were silently left uncovered (T0 pilot 2026-09-09, fix class R-7, 2026-09-10).
# Key -> question template ({name} = page title), merged ahead of the engine
# dict by the builder (config.identity_fields). Deliberately NOT here:
# `name` (the subject itself, skipped by the builder), `alias`/`affiliation`
# (roster path, LIST_FIELDS), `image1` (a media filename, prose-unreachable).
identity_fields:
  adapted from: "What is {name} adapted from?"
  affiliates: "Who are {name}'s affiliates?"
  aliases: "What are {name}'s aliases?"
  allegiance: "What is {name}'s allegiance?"
  air date: "When did {name} air?"
  anime_debut: "In which anime episode is {name} first depicted?"
  arc: "In which arc does {name} appear?"
  arrangement: "Who arranged {name}?"
  artist: "Who is the artist of {name}?"
  birthplace: "Where was {name} born?"
  chapter: "In which chapter does {name} appear?"
  chapters: "Which chapters are included in {name}?"
  characters: "Which characters are associated with {name}?"
  composer: "Who composed {name}?"
  contracted devils: "Which devils has {name} contracted?"
  contracted humans: "Which humans is {name} contracted to?"
  cost: "How much does {name} cost?"
  cover char: "Which characters appear on the cover of {name}?"
  date: "What date is associated with {name}?"
  employees: "Who are {name}'s employees?"
  ending song: "What is the ending song of {name}?"
  eng release: "When was {name} released in English?"
  english: "What is the English title of {name}?"
  english voice: "Who is {name}'s English voice actor?"
  ep number: "What is the episode number of {name}?"
  ep title: "What is the episode title associated with {name}?"
  episode: "In which episode does {name} appear?"
  episodes: "Which episodes are included in {name}?"
  genre: "What genre is {name}?"
  issue: "What issue is {name} from?"
  jan: "What is {name}'s JAN code?"
  japanese voice: "Who is {name}'s Japanese voice actor?"
  jname: "What is the Japanese title of {name}?"
  jp release: "When was {name} released in Japan?"
  length: "How long is {name}?"
  manga_debut: "In which manga chapter does {name} first appear?"
  next: "What comes after {name}?"
  notable_members: "Who are {name}'s notable members?"
  op/ed number: "What is {name}'s op/ed number?"
  opening song: "What is the opening song of {name}?"
  original run: "What was the original run of {name}?"
  page: "On which page does {name} appear?"
