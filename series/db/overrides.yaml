# Per-wiki handling for the Dragon Ball Wiki.

# Dragon Ball is not one work, it is seven, and they all number from 1. The wiki
# cites in prose inside an HTML `<ref>`, naming the work every time:
#
#     <ref>''[[Dragon Ball Z]]'' episode 130, "..."</ref>
#     <ref>''[[Dragon Ball Super (manga)|Dragon Ball Super]]'' chapter 42</ref>
#     <ref>''[[Dragon Ball GT]]'' episode 40</ref>
#
# Rendering all of those as "(Episode 130)" would be worse than useless: Z 130,
# Super 130 and GT 130 are three unrelated scenes, and a script citing the wrong
# one is confidently wrong. So each work carries its own label.
#
# Order matters. These are tried top to bottom and the first match wins, so the
# longer names come first — "Dragon Ball Super" has to be matched before
# "Dragon Ball", or every Super reference would be filed under the original.
#
# The original series is unprefixed, the same way the main series is on every
# other wiki here: "(Episode 130)" means Dragon Ball, and anything else says so.
citation_ref_tags:
  # Super Dragon Ball Heroes and its mission subtitles, longest first.
  - match: 'Super Dragon Ball Heroes[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Heroes
  - match: 'Super Dragon Ball Heroes[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Heroes
  - match: 'Dragon Ball Heroes[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Heroes

  - match: 'Dragon Ball Z Kai[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Kai
  - match: 'Dragon Ball Daima[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Daima

  - match: 'Dragon Ball Super[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Super
  - match: 'Dragon Ball Super[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Super
  - match: 'Dragon Ball Super[^'']*?''*,?\s*volume\s+(\d+)'
    as: volume
    work: Super

  - match: 'Dragon Ball GT[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: GT

  - match: 'Dragon Ball Z[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Z
  - match: 'Dragon Ball Z[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Z

  # The original series last, so it only catches what the others did not.
  - match: 'Dragon Ball[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
  - match: 'Dragon Ball[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter

  # A bare reference with no work named. The original series is the default
  # everywhere else on this wiki, so it is the default here too.
  - match: 'chapter\s+(\d+)'
    as: chapter
  - match: 'episode\s+(\d+)'
    as: episode

# Deliberately unmatched: Daizenshuu guidebooks, and the many game references
# (Xenoverse, Budokai Tenkaichi, Legends, Kakarot). They cite a real source but
# not an instalment of the story, and a script cannot tag a line with a video
# game. They render as nothing, which is the same answer Berserk's cover-art
# references get.

# The audit flags reference parameters it does not understand. These are the
# wiki's own misspellings of `accessdate`, `publisher` and `language` inside
# {{cite web}} references — none carries a locator, so each is mapped to the
# ignored `page` role rather than polluting the unknown-parameter report.
citation_params:
  acessdate: page
  accesdate: page
  pubisher: page
  pulbisher: page
  pubilsher: page
  datae: page
  lanuage: page

# Pages that never belong in a script: video games, soundtrack pages, and the
# tail of pages no infobox could type (dubs, publishers, companies, staff).
# Removed by `prune`; brought back only by an explicit `crawl --refresh`.
prune_types:
  - cvg
  - music
  - unknown

# Works whose entries are not the story, however the wiki files them.
#
# `canon_media` cannot see these, because it reads the medium out of the debut
# string and Super Dragon Ball Heroes has its own manga *and* its own
# promotional anime. `Super Saiyan (Berserk)` declares
#
#     Game: Dragon Ball Heroes  Manga: "Evil Saiyan"  Anime: "Goku Goes Berserk!"
#
# and so reads as canon on two counts out of three. What settles it is that the
# debut *edges* point at the work, and every one of them here is Heroes:
#
#     Evil Saiyan (chapter)                [Dragon Ball Heroes manga chapters]
#     Goku Goes Berserk! ...               [Dragon Ball Heroes episodes]
#     Dragon Ball Heroes                   [the game]
#
# A member is dropped only when *every* debut work is one of these. Super Saiyan
# Blue also names Dragon Ball Heroes and debuted in Resurrection 'F', so "names
# one of these" would have thrown away half the canon forms.
#
# Matched on the whole title or a title prefix, never as a substring: `Dr. Hedo`
# debuts in `Super Heroes are Born`, a Dragon Ball Super chapter, and a bare
# "heroes" test dropped him. The prefixes also reach the works' own categories,
# which is what catches every Heroes chapter without naming any of them.
#
# A question that names one of these gets them back — see `_ALL_SCOPE`.
non_canon_works:
  # Quoted where a title contains a colon: unquoted, YAML reads
  # `Dragon Ball Z: Dokkan Battle` as a mapping, not a string.
  - Dragon Ball Heroes           # also "Dragon Ball Heroes: Victory Mission"
  - Super Dragon Ball Heroes
  - Dark Demon Realm
  - Dragon Ball Xenoverse
  - "Dragon Ball Z: Dokkan Battle"
  - Dragon Ball FighterZ
  - Dragon Ball Legends
  - Dragon Ball Super Card Game
  # Not a work but a naming convention: the Heroes timeline prefixes its own
  # version of a character with `Xeno`, so `Xeno Goku` and `Xeno Trunks` are
  # Heroes-exclusive characters with canon namesakes. Matched as a title
  # prefix, which reaches the 23 of them and nothing else — no category on
  # this wiki begins with the word.
  #
  # The category `DBH Characters` is deliberately NOT here. It reads like the
  # obvious declaration and means "appears in Heroes", not "belongs to it":
  # it sits on 207 canon characters including Beerus, Broly, Bulma, Cell and
  # Android 18, and declaring it deletes most of the roster.
  - Xeno

# Where this wiki writes a character's abilities in prose.
#
# Dragon Ball records ownership as `users` edges and answers most questions
# from them, so extraction never ran here at all — and the forms it was
# missing are all sitting in a subpage nothing was reading:
#
#     Frieza/Power and Abilities  §Abilities   first, second, third and final
#                                              form, 100% full power, mecha
#     Goku/Power and Abilities    208,360 chars — great ape, kaio-ken, base,
#                                              super saiyan blue kaio-ken
#     Vegeta/Power and Abilities  135,594 chars — and majin vegeta
#
# Twenty-three characters have one. They are long, so this is the most
# expensive declaration in the project, and the only place those forms exist.
# Only the subpage title. `Power` and `Abilities` on their own are section
# headings on 900 pages here, and declaring them turned a 23-character read
# into a 907-character one for nothing: `passages()` already matches on the
# page title, so `Frieza/Power and Abilities` reaches its own §Power and
# §Abilities sections without either being named.
ability_sections:
  transformation: [Power and Abilities]
  technique: [Power and Abilities]
  item: [Equipment]

