# Per-wiki handling for the Dragon Ball Wiki.

# Dragon Ball is not one work, it is seven, and they all number from 1. The wiki
# cites in prose inside an HTML `<ref>`, naming the work every time:
#
#     <ref>''[[Dragon Ball Z]]'' episode 130, "..."</ref>
#     <ref>''[[Dragon Ball Super (manga)|Dragon Ball Super]]'' chapter 42</ref>
#     <ref>''[[Dragon Ball GT]]'' episode 40</ref>
#
# Rendering all of those as "(Episode 130)" would be worse than useless: Z 130,
# Super 130 and GT 130 are three unrelated scenes, and a script citing the wrong
# one is confidently wrong. So each work carries its own label.
#
# Order matters. These are tried top to bottom and the first match wins, so the
# longer names come first — "Dragon Ball Super" has to be matched before
# "Dragon Ball", or every Super reference would be filed under the original.
#
# The original series is unprefixed, the same way the main series is on every
# other wiki here: "(Episode 130)" means Dragon Ball, and anything else says so.
citation_ref_tags:
  # Super Dragon Ball Heroes and its mission subtitles, longest first.
  - match: 'Super Dragon Ball Heroes[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Heroes
  - match: 'Super Dragon Ball Heroes[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Heroes
  - match: 'Dragon Ball Heroes[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Heroes

  - match: 'Dragon Ball Z Kai[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Kai
  - match: 'Dragon Ball Daima[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Daima

  - match: 'Dragon Ball Super[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Super
  - match: 'Dragon Ball Super[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Super
  - match: 'Dragon Ball Super[^'']*?''*,?\s*volume\s+(\d+)'
    as: volume
    work: Super

  - match: 'Dragon Ball GT[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: GT

  - match: 'Dragon Ball Z[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
    work: Z
  - match: 'Dragon Ball Z[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter
    work: Z

  # The original series last, so it only catches what the others did not.
  - match: 'Dragon Ball[^'']*?''*,?\s*episode\s+(\d+)'
    as: episode
  - match: 'Dragon Ball[^'']*?''*,?\s*chapter\s+(\d+)'
    as: chapter

  # A bare reference with no work named. The original series is the default
  # everywhere else on this wiki, so it is the default here too.
  - match: 'chapter\s+(\d+)'
    as: chapter
  - match: 'episode\s+(\d+)'
    as: episode

# Deliberately unmatched: Daizenshuu guidebooks, and the many game references
# (Xenoverse, Budokai Tenkaichi, Legends, Kakarot). They cite a real source but
# not an instalment of the story, and a script cannot tag a line with a video
# game. They render as nothing, which is the same answer Berserk's cover-art
# references get.

# The audit flags reference parameters it does not understand. These are the
# wiki's own misspellings of `accessdate`, `publisher` and `language` inside
# {{cite web}} references — none carries a locator, so each is mapped to the
# ignored `page` role rather than polluting the unknown-parameter report.
citation_params:
  acessdate: page
  accesdate: page
  pubisher: page
  pulbisher: page
  pubilsher: page
  datae: page
  lanuage: page

# Pages that never belong in a script: video games, soundtrack pages, and the
# tail of pages no infobox could type (dubs, publishers, companies, staff).
# Removed by `prune`; brought back only by an explicit `crawl --refresh`.
prune_types:
  - cvg
  - music
  - unknown

# The sets this wiki maintains. Every entry verified to return members.
rosters:
  # Declared for the vocabulary rather than for the set: discovery finds `Races`
  # on its own, but "non-humans" prefix-matched `Non-english dubs` and returned
  # twenty-two dub pages.
  - name: Races
    match: [race, races, species, non-human, non-humans, nonhuman, nonhumans]
    category: Races

  # The wiki files these under `Films`; a viewer asks for movies. Split three
  # ways by series, which is also how anyone naming them would group them.
  - name: Films
    match: [movie, movies, film, films]
    categories:
      - Dragon Ball films
      - Dragon Ball Z films
      - Dragon Ball Super films

  # The one set whose name is also the series' name. Only the qualified
  # phrasings are declared: matching a bare "dragon ball" made every enumeration
  # on this wiki resolve here, because every one of them says the series' name.
  - name: Dragon Balls
    match: [type of dragon ball, types of dragon ball, kind of dragon ball, kinds of dragon ball]
    category: Balls

  - name: Saiyans
    match: [saiyan, saiyans]
    category: Saiyans

  - name: Transformations
    match: [transformation, transformations, form, forms]
    category: Transformations

  - name: Androids
    match: [android, androids, artificial human]
    category: Androids

  # `kai` and `kais` are deliberately absent from `Deities`. They used to be
  # there, and because a declared phrase consumes the whole topic, "Every Kai"
  # resolved here and answered with 169 deities at full confidence — with no
  # qualifier left over for the validator to notice.
  - name: Deities
    match: [deity, deities, god, gods]
    category: Deities

  # The wiki keeps no Kai category, and left to discovery "Every Kai" matched
  # the *anime series* `Dragon Ball Z Kai` and returned four of its songs. Named
  # outright instead, as the Gods of Destruction are.
  - name: Kais
    match: [kai, kais, kaioshin, supreme kai, supreme kais]
    members: [King Kai, East Kai, West Kai, South Kai, Grand Kai, Old Kai,
              Kibito Kai, Grand Supreme Kai, Demon Supreme Kai]

  # Twelve, one per universe, and the wiki keeps no category for them — only
  # `God of Destruction Beerus Saga`, which is a story arc. Without this the
  # topic fell through to `Deities` and answered with all 168.
  - name: Gods of Destruction
    match: [god of destruction, gods of destruction, destroyer god, destroyer gods]
    # `Mule` is this wiki's title for Universe 3's, whom other sources call
    # Mosco — names are checked against the store, so the wrong one would show
    # up as an eleven-member set rather than as a silent gap.
    members: [Beerus, Champa, Belmod, Quitela, Sidra, Iwan, Heles,
              Mule, Arak, Liquiir, Rumsshi, Giin]

  - name: Demons
    match: [demon, demons]
    category: Demons

  - name: Majin
    match: [majin, majins, buu]
    category: Majin

  - name: Angels
    match: [angel, angels]
    category: Angels

  - name: Fusions
    match: [fusion, fusions, fused]
    category: Fusion

  - name: Z Fighters
    match: [z fighter, z fighters]
    category: Z Fighters

  - name: Earthlings
    match: [earthling, earthlings]
    category: Earthlings

  - name: Tournament Fighters
    match: [tournament fighter, tournament fighters, tournament]
    category: Tournament fighters

  - name: Galactic Frieza Army
    match: [frieza army, frieza force, galactic frieza army]
    category: Galactic Frieza Army

  - name: Energy Sphere Attacks
    match: [energy sphere, energy sphere attack, ki blast, ki blasts]
    category: Energy Sphere attacks

  # The wiki files characters by which series they appear in, which is the
  # cleanest handle on "every character in Z" versus "in Super".
  - name: Characters by Series
    match: [character by series, characters by series, cast]
    groups:
      Dragon Ball: DB Characters
      Dragon Ball Z: DBZ Characters
      Dragon Ball Super: DBS Characters
      Dragon Ball Heroes: DBH Characters
