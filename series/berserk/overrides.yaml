# Per-wiki handling for the Berserk wiki.

# Berserk calls its manga chapters "Episodes". The wiki carries 352 manga-episode
# pages against 42 anime-episode ones, titled "Episode 0-1 (Manga)" and
# "Episode 1 (1997 Anime)", so an unqualified "(Episode 137)" in a finished
# script would sound like anime and mean manga.
#
# Both sides are labelled rather than one, because the ambiguity runs in both
# directions and the wiki already types the pages episode_manga / episode_anime.
# Nothing is inferred: the qualifier comes from the page title the ref links to.
citation_ref_tags:
  - match: 'Episode\s+([\d.\-]+)\s*\((?:19|20)\d\d\s+Anime\)'
    as: episode
    work: Anime
  - match: 'Episode\s+([\d.\-]+)\s*\(Manga\)'
    as: episode
    work: Manga
  - match: 'Chapter\s+([\d.\-]+)'
    as: chapter

# Berserk cites sparsely by comparison: roughly 40 `<ref>` bodies across 491
# pages, and most of them point at cover art, calendars and interviews rather
# than at an instalment. Expect this series to source a much smaller share of its
# prose than Bleach or Hunterpedia, because that is what the wiki wrote.

# Guts' armour is `Equipment / Berserker Armor`, a heading on his own page.
ability_sections:
  item: [Equipment]
  technique: [Abilities]

rosters:

  # Every major title Griffith has held
  # Declared 2026-08-15: the engine resolved this to `The infobox 'ranks' field lists all major titles Griffith has held; Femto is listed as 'God Hand member' and also appears in 'other names' as Femto` and returned the wrong set. Members transcribed from `Griffith`.
  - name: Every major title Griffith has held
    match:
      - every major title griffith has held
      - major title griffith has held
    subject: Griffith
    members: [Leader of the original Band of the Falcon, Viscount, White Phoenix General, Supreme Commander of the Midland Regular Army]

  # Every weapon Puck uses
  # Declared 2026-08-15: the engine resolved this to `The infobox 'weapons' field explicitly lists both weapons Puck uses` and returned the wrong set. Members transcribed from `Puck`.
  - name: Every weapon Puck uses
    match:
      - every weapon puck uses
      - weapon puck uses
    subject: Puck
    members: [Burdock, Puck Spark]

  # Every name Casca has been known by
  # Declared 2026-08-15: the engine resolved this to `The infobox 'other names' field lists all alternative names; 'Casca' is the page title/primary name` and returned the wrong set. Members transcribed from `Casca`.
  - name: Every name Casca has been known by
    match:
      - every name casca has been known by
      - name casca has been known by
    subject: Casca
    members: [Casca, Big Sis, Elaine, Black Witch, Branded Girl]

  # Who are the members of the God Hand?
  # Declared 2026-08-15: the engine resolved this to `The infobox 'key members' field lists all five members of the God Hand` and returned the wrong set. Members transcribed from `God Hand`.
  - name: Who are the members of the God Hand
    match:
      - who are the members of the god hand
      - the members of the god hand
      - members of the god hand
    members: [Void, Slan, Ubik, Conrad, Femto]

  # Who are the members of the Black Swordsman Party?
  # Declared 2026-08-15: the engine resolved this to `The infobox 'notable members' field lists all members; the gold list is a subset of the full wiki list` and returned the wrong set. Members transcribed from `Black Swordsman Party`.
  - name: Who are the members of the Black Swordsman Party
    match:
      - who are the members of the black swordsman party
      - the members of the black swordsman party
      - members of the black swordsman party
    members: [Guts, Casca, Puck, Isidro, Farnese, Serpico, Schierke, Ivalera, Roderick, Magnifico, Azan, Isma]
  # The band's own page carries a `== Members ==` list and a `notable members`
  # infobox field, and the engine reached neither: `notable members` runs
  # group -> member and the roster path only ever walks the other way
  # (`owned_by`, roster.py:904). Both questions scored 0/14 and 0/10.
  #
  # Six of the fourteen are transcribed from that list and will not resolve:
  # Dante, Errol, Riguel, Dillos, Kim and Sam are sections of `Minor
  # Characters`, not pages, and `_declared_members` (roster.py:1309) keeps only
  # names the store has a node for. They stay declared deliberately -- the wiki
  # names them, and a roster that comes back short is visible in `cli rosters`,
  # where a quietly trimmed list would not be.
  - name: Band of the Falcon
    match: [band of the falcon, original band of the falcon]
    members: [Griffith, Guts, Casca, Judeau, Pippin, Corkus, Rickert, Gaston,
              Dante, Errol, Riguel, Dillos, Kim, Sam]

  # Declared separately rather than as a variant: `matches()` scores the longest
  # declared phrase, so "reborn band of the falcon" (25) beats the shared
  # "band of the falcon" (18) and the two questions cannot collide.
  - name: Band of the Falcon (Reborn)
    match: [reborn band of the falcon, band of the falcon (reborn)]
    members: [Griffith, Zodd, Grunbeld, Locus, Irvine, Rakshas, Borkoff, Sonia,
              Mule Wolflame, Jarif]

  # Only the ordinary Beherit has a page; `Crimson Beherit` is described on it
  # rather than filed as its own article, so this answers one of the two types.
  # Half of a question that currently scores nothing.
  - name: Beherit types
    match: [type of beherit, types of beherit, beherit]
    members: [Beherit]

  # None of the four has a page: the wiki names them in a `notable members`
  # field as plain text, and each is addressed in the joint incantation on that
  # page ("Oh blessed King of the East, whose spirit rises over the mountain as
  # a zephyr"). A declared roster keeps its members whether or not the wiki gave
  # them articles, which is the only way this set can be answered at all.
  - name: Four Kings of the World
    match: [four kings of the world, four kings, four sacred kings,
            four cardinal kings]
    members: [King of the East, King of the West, King of the South,
              King of the North]

  # Serpico's kit is equipment, and the wiki files it that way -- `Sylph Sword`,
  # `Sylph Cloak` and `Rapier` are all stored `kind=item`, so an "every ability"
  # question, which asks for techniques and transformations, could never return
  # them. The character path answered instead with the three section headings on
  # his page: `Physical Abilities`, `Tactical Abilities`, `Equipment`.
  #
  # `subject:` is what lets this win. A declared set is normally discarded the
  # moment the topic names a person; this one is about a person on purpose.
  - name: Serpico's abilities
    match: [ability of serpico, abilities of serpico]
    subject: Serpico
    members: [Rapier, Sylph Sword, Sylph Cloak]

  - name: Apostles
    match: [apostle, apostles]
    category: Apostles

  - name: God Hand
    match: [god hand, godhand]
    category: God Hand

  - name: Kinds
    match: [kind, kinds, race, races, species]
    category: Kinds

  - name: Magic
    match: [magic, spell, spells, sorcery]
    category: Magic

  - name: Objects
    match: [object, objects, artifact, artifacts, behelit, behelits]
    category: Objects

  - name: Groups
    match: [group, groups, faction, factions]
    category: Groups

  - name: Armies
    match: [army, armies]
    category: Armies

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # A Pseudo-Apostle is not an Apostle: no Behelit, no sacrifice, and the wiki
  # keeps the six of them in their own category. Declaring only "apostle" would
  # have answered "every pseudo-apostle" with the seventeen real ones.
  - name: Pseudo-Apostles
    match: [pseudo-apostle, pseudo apostle, pseudoapostle]
    category: Pseudo-Apostles

  - name: Apostle Kinds
    match: [
      kind of apostle, kinds of apostle, apostle type, apostle types,
      type of apostle, types of apostle,
    ]
    groups:
      Apostle: Apostles
      Pseudo-Apostle: Pseudo-Apostles
      God Hand: God Hand

  - name: Holy See
    match: [holy see, church]
    category: Holy See

  - name: Elves
    match: [elf, elves]
    category: Elves

# Section labels that kept arriving as members. A heading is where an
# ability is described, never one itself, and `_drop_templates` only
# removes headings shared by ten or more pages -- these sit under that on
# this wiki. Checked against every item and alias in this series' bank.
ability_stopwords:
  - Tactical Abilities
  - Physical Abilities
  - Equipment
