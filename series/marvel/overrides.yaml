# Per-wiki handling for the Marvel Database (marvel.fandom.com).
# The only place series-specific rules may live (config.load_overrides).
#
# The wiki's infoboxes are project-namespace templates, and NONE of the 508
# `Template:`-namespace names contains the word "infobox" (measured
# 2026-09-25: only `Template:Short Info` matches "info"). Crawl-time
# `build_ontology` elects types by that word match, so without these aliases
# every page would store as type `unknown` with zero infobox facts (plan
# MARVEL_100_PLAN.md §1, L1). The ~30 infobox templates live in the
# `Marvel Database:` namespace (id 4, 162 pages).

type_aliases:
  "Marvel Database:Character Template": character
  "Marvel Database:Event Template": event
  "Marvel Database:Event Infobox Template": event
  "Marvel Database:Comic Template": comic
  "Marvel Database:Series Template": series
  "Marvel Database:Volume Template": volume
  "Marvel Database:New Volume Template": volume
  "Marvel Database:Legacy Volume Template": volume
  "Marvel Database:Film Template": film
  "Marvel Database:Episode Template": episode
  "Marvel Database:Organization Template": organization
  "Marvel Database:Team Template": team
  "Marvel Database:Location Template": location
  "Marvel Database:Item Template": item
  "Marvel Database:Power Template": power
  "Marvel Database:Vehicle Template": vehicle
  "Marvel Database:Race Template": race
  "Marvel Database:Reality Template": reality
  "Marvel Database:Creator Template": creator
  "Marvel Database:Staff Template": staff
  "Marvel Database:Conflict Template": conflict
  "Marvel Database:Story Arc Template": story_arc
  "Marvel Database:Storyline Template": storyline
  "Marvel Database:Novel Template": novel
  "Marvel Database:Book Template": book
  "Marvel Database:Video Game Template": video_game
  "Marvel Database:Board Game Template": board_game
  "Marvel Database:Publisher Template": publisher
  "Marvel Database:Glossary Template": glossary
  "Marvel Database:Handbook Template": handbook
  "Marvel Database:Sourcebook Template": sourcebook
  "Marvel Database:Review Template": review
  "Marvel Database:Gallery Template": gallery
  "Marvel Database:Image Template": image
  # `User Page Template` and `Templates` (a meta-listing) are deliberately not
  # typed: user pages are maintenance, and the meta page describes templates.

# The wiki's citation grammar: character pages cite comic issues by named
# reference, e.g. `{{r|Amazing Spider-Man Vol 1 15}}` and `{{r|Ultimate
# Fallout Vol 1 4}}` (measured 2026-09-25 on Miles Morales / Peter Parker
# pages). Declared here so citations resolve to a work + number; the exact
# RefRole shape is verified in Phase C1 (plan MARVEL_100_PLAN.md) before any
# citation-dependent extraction — this key stays commented until then.
# citation_params:
#   r: comic

# L5 (plan §1): category -> relation grammar. The generic mechanism
# (ingest/category_relations.py, CLI `category-relations`) matches each
# category name against the patterns below and writes the edge the
# category states. Pre-registered 2026-09-25, activated for C2
# 2026-09-27 against the G6-final store (2,582,190 category rows /
# 212,341 names):
#   `X (Earth-616)/Members`  -> member_of X      (49,244 rows / 34,646 docs)
#   `Stan Lee/Creator`       -> created_by Stan Lee (200,375 rows /
#                               102,867 docs — the category sits under the
#                               CREATOR's page, the work is the member)
#   `X casualties`           -> event_participant (kind: casualty, 993 rows)
#   `YYYY Character Debuts`  -> debuted_year YYYY (a property, not a node;
#                               79,625 rows, written to facts)
# Target resolution: exact node name = confidence 1.0, alias hit 0.9,
# unresolved = counted and skipped, never invented. `contradicts:` is the
# plan's gate: the audit samples the edge against the page's own infobox
# field, and an edge the field denies is a finding, not a keep.
category_relations:
  - {pattern: "^(.+)/Members$", relation: member_of, target: 1, contradicts: affiliation}
  - {pattern: "^([^/]+)/Creator$", relation: created_by, target: 1, contradicts: creators}
  - {pattern: "^(.+) casualties$", relation: event_participant, kind: casualty, target: 1}
  - {pattern: '^(\d{4}) Character Debuts$', relation: debuted_year, value: 1}

# NOTE (L2): disambiguation pages (e.g. `Spider-Man`) carry the wiki's own
# alias graph (`main_articleN` lists) but the engine's default skip pattern
# drops them. Declaring `skip_patterns:` below takes ownership of the pattern
# behaviour (the declared list replaces the engine's MediaWiki-wide defaults;
# `skip_categories:` still adds exact names on top), so the disambiguation
# pages are crawled and their alias data is on disk. The gap-fill is a plain
# re-run of the crawl after this hook lands: the resume is disk-driven, so
# exactly the pages the earlier run skipped are the ones re-fetched.
# (plan MARVEL_100_PLAN.md §1 L2 + step A1b; landed 2026-09-25.)
# 100% scope (2026-09-29, architect): the MediaWiki default skip patterns
# "images", "stubs", "browse" and "wiki" match CONTENT categories on this wiki
# ("Articles with No Applicable Images", "Article stubs"): a stub is a short
# article, still lines of the corpus. They caused the delta found at MCU shard 1
# (mcu 3,672 / marvel 19,532 plain article titles enumerated, never fetched).
# Kept: the genuinely non-content filters.
skip_patterns:
  - gallery
  - galleries
  - candidates for deletion
  - disambiguation
  - blog posts
  - site maintenance
  - templates
# The character boxes carry the live alias under `CurrentAlias` (plan §1 L8
# field list), which the engine's built-in alias keys never look for.
alias_fact_keys:
  - currentalias
skip_categories: []

# C1 (plan MARVEL_100_PLAN.md §4): per-wiki identity-field map (fix class R-7,
# config.identity_fields). The character infobox (`Character Template`) uses
# a DB-flattened vocabulary the shared engine dict does not name
# (measured 2026-09-27 from the G6 final extract: 1,471,259 character pages);
# keys not mapped here stay with the reader (the ledger leaves their section
# uncovered). Deliberately NOT here: `name` (the subject, skipped by the
# builder), `currentalias`/`aliases`/`nicknames`/`spouses` (roster path,
# LIST_FIELDS), `history`/`abilities`/`equipment`/`weapons`/`relatives`
# (prose beats, left to a reader), `nogallery`/`gallerytype`/`gallerydata`
# (maintenance), `wikipedia`/`links`/`marvel` (external), `notes`/`trivia`/
# `overview`/`appendix` (open prose), `quotation`/`speaker`/`quotesource`
# (the quote box, not identity).
identity_fields:
  reality: "What is {name}'s home reality?"
  creators: "Who created {name}?"
  first: "In which comic does {name} first appear?"
  origin: "What is {name}'s origin?"
  identity: "What is the status of {name}'s identity?"
  citizenship: "What is {name}'s citizenship?"
  hair: "What color is {name}'s hair?"
  eyes: "What color are {name}'s eyes?"
  skin: "What is {name}'s skin color?"
  baseofoperations: "What is {name}'s base of operations?"
  maritalstatus: "What is {name}'s marital status?"
  death: "In which comic does {name} die?"
  killedby: "Who killed {name}?"
  causeofdeath: "What is {name}'s cause of death?"
  placeofbirth: "Where was {name} born?"
  # `height`/`weight`/`gender`/`occupation`/`status` are already in the
  # shared engine dict and need no per-wiki entry.

# C3 (plan MARVEL_100_PLAN.md §4, A1b): a disambiguation page (606 of them,
# page_type `disambiguation`) is the wiki's own statement of what a bare term
# refers to; its list fields file the entries. `alias-align` parses the
# entries (first line, `<name> from <file>.jpg` stripped, bare image
# filenames skipped) and promotes the resolvable names into the `aliases`
# table (exact 1.0 / alias 0.9; unresolved flagged, never invented).
disambig_list_keys:
  - others
  - related
  - teams
  - media
  - main_article1
  - main_article2

# Chunk containment (plan MARVEL_100_PLAN.md §4, gate C): the span-recall
# oracle counts the trivia prose under `Notes` / `References` / `Gallery`
# / `Image Gallery` / `External Links` as reachable content (the JJK
# precedent: `References` trivia is in oracle scope, so the chunker must
# index it too), but the engine's default boilerplate set skips those
# sections -- 214 sentences in 80 documents were unreachable on the
# 2026-09-27 tier-0 run (Notes 101, References 85, Gallery 14, Image
# Gallery 13, External Links 1). Promoting them to content makes the
# chunker index them; sections with no text of their own still die in
# the chunker's `word_count == 0` guard.
content_sections:
  - references
  - notes
  - gallery
  - image gallery
  - external links
# The JJK-era page-gen guard bans the route keywords "arc"/"saga" in roster
# match phrases. The router only routes on `arc` where the wiki records `arc`
# facts (router.py `_FIELD_ASKERS`), and marvel records none, so the ban is a
# false positive here: the words are ordinary names (measured 2026-09-27:
# 6/99,591 tier-a character titles trip it -- Arc (Hellbent) (Earth-616),
# Arc (Imperial Guard) (Earth-21923/616), Arc Light (Earth-616),
# Jeanne d'Arc (Earth-616), Saga (Earth-616) -- the tier-a sweep hard-erred
# all 4 pages it had reached). Declaring the ban empty turns the guard off
# for this series; the JJK default (arc, saga) is untouched.
roster_route_words: []
# P4b (2026-09-28): P4's infobox branch types a page from its richest box
# before the subpage rule, and the wiki's `Cite` citation wrapper won on
# three prose subpages, shadowing their parent-derived types (the P4 diff
# classes character_expanded_history->cite x1 plus the Character Index and
# Spider Society Members rows; ~26,000 Cite-family boxes across 2,658 pages:
# 23,309 {{cite}}, 2,308 {{cite web}}, plus case variants). A citation box is
# the page's apparatus, not its subject: this declaration withholds the type
# on subpages (the parent-derived type stands) while the box stays in the
# discovered vocabulary, so its facts are still extracted (n_facts unchanged
# base vs P4: 7/8/10 on the three rows). Main pages keep the box's type —
# the 23 pre-existing cite-typed main pages are deliberately untouched.
facts_only_infoboxes:
  - "Cite"
  - "Cite web"
# C4 events (2026-09-28): this wiki files arc pages under its own
# `Marvel Database:Story Arc Template` name, `story_arc`, which the engine's
# default placement set (arc/saga/event/battle/story_arcs) does not read.
events:
  # Council step 1 (2026-09-29, reports/marvel/SCHEMA_TEST_who_would_win_2026-09-29.md):
  # the shared verb set records that a fight happened, not who won; 0 of 30
  # "who would win" questions were answerable from its rows, while 8.7% of
  # Marvel history sentences state an outcome. The outcome verbs this wiki's
  # rows may use: `defeated` (subject beat object; "Y lost to X" is written
  # X defeated Y), `escaped` (subject got away from object), `captured`
  # (subject captured / subdued / imprisoned object). `fought` stays for a
  # fight whose outcome the passage does not state.
  extra_verbs: [defeated, escaped, captured]
  # R12 fix 3 (2026-09-29): the wiki's alphabetical Character Index pages
  # ("Character Index/M") are navigation, not participants (seen as a row end
  # in the 2026-09-29 model trials). Same mechanism as the mcu's `Hub:`.
  participant_excludes:
    - "Character Index/"
  placement_types: [story_arc]
  # R3 (2026-09-28 architect steer): this wiki's declared time axis. A page
  # with a `releasedate` sits at its publication clock; a page without one
  # inherits the clock of the instalments it cites -- its `first` / `last`
  # appearance and a multi-part story's `part*` instalments (the pattern
  # also reaches the contaminated `part1_above` / `partof*` keys; their
  # unparseable or unresolvable values are counted unmapped, never guessed).
  # The axis is partitioned by the `reality` fact value: within a partition
  # the wiki's own order is law, between partitions the value sort is only a
  # sort; a page carrying no `reality` fact sits in the counted `<no value>`
  # bucket, last. A multi-valued reality (e.g. `Earth-616; Tierra-616`,
  # 307 rows) is one counted bucket of its own.
  axis:
    date_keys: [releasedate]
    order_keys: [first, last, "part*"]
    partition_key: reality
  # R8 (2026-09-28 architect finding): the wiki's reality-naming convention,
  # declared here instead of hard-coded in the engine. The engine reads this
  # block (`reality_config`); a wiki that declares nothing gets no reality
  # partitioning. The `value_patterns` fold `Earth-616` / `Tierra-616` /
  # `616` to one key, the way the values on this wiki actually mix.
  reality:
    title_pattern: '\((?:[Ee]arth|[Tt]ierra)-?([\w-]+)\)\s*$'
    value_patterns:
      - '(?i)^(?:earth|tierra)-?(.+)$'
    fact_key: reality
  # R9 (2026-09-28 architect finding, 100% scope): the wiki's long-prose fact
  # keys, measured 2026-09-28 against the store (rows / total chars):
  # solicit 33,529 / 13.0M, powers 14,817 / 6.7M, abilities 7,319 / 1.4M,
  # overview 4,119 / 1.6M, personality 934 / 0.57M, professionalhistory
  # 896 / 0.47M, properties 760 / 0.58M, plot 227 / 0.78M. Under the owner's
  # 100% definition these are lines the extractor reads, never silence: all
  # declared. `powers`/`abilities` are the abilities dimension (plan C5) and
  # move to that pass under a council sequencing ruling -- declared here in
  # the meantime, so nothing is dropped. The dry-run's per-key census
  # (`fact_key_census`) reports covered/total for each of these.
  # R10 (2026-09-29): the wiki's two biggest story keys were never declared --
  # `history` 127,035 rows / 106.7M chars and `synopsis*` ~40k rows / 61.5M
  # (the wiki's two largest prose stores) -- plus `weakness*` (the abilities
  # dimension, 3,939 / 0.85M) and `alternateversions` (198 / 0.41M). Declared
  # here so the `all` queue reaches them: a page whose story lives only in fact
  # values joins the queue on its prose fact values (`scope_plan` /
  # `fact_pages`), so a fact-only page is read, not skipped.
  narrative_fact_keys:
    - solicit
    - powers
    - abilities
    - overview
    - personality
    - professionalhistory
    - properties
    - plot
    - history
    - "synopsis*"
    - "weakness*"
    - alternateversions
  # R10 (2026-09-29): the prose fact keys this wiki deliberately does NOT read
  # as narrative, each with a one-line reason. Inert (no extraction behaviour
  # reads them) but counted: the dry-run census (`fact_key_census`) reports
  # each, so a key the council later wants read is a one-line move to
  # `narrative_fact_keys`, never a silence. `appearing*` (the "appears in"
  # rosters, 82,853 rows / 11.8M) is roster/structure, not prose (plan C1) --
  # recorded in the receipt and counted here.
  excluded_fact_keys:
    - {key: "notes*", reason: "open prose / editorial notes, not story beats (C5 relations work)"}
    - {key: "trivia*", reason: "trivia, not narrative"}
    - {key: pointsofinterest, reason: "reference list, not story beats"}
    - {key: "others*", reason: "disambiguation roster (C3), not prose"}
    - {key: "related*", reason: "disambiguation / related references, not prose"}
    - {key: "appearances*", reason: "appearance roster (C1), not prose"}
    - {key: "appearing*", reason: "appears-in roster / structure (C1), not prose"}
