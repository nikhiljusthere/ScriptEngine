# What this wiki calls its infoboxes, where the shared vocabulary reads them
# wrong. `combat` is the whole reason this key exists here: 48 pages use it and
# every one is an ability -- Fire Manipulation, Water Manipulation, Killer Move:
# Serious Series, Roaring Aura Sky Ripping Fist. The token table maps `combat`
# to `event` because on other wikis it means a fight, and `event` is in
# `NEVER_MEMBERS`, so none of the 48 could be a member of anything. Two of them
# are gold for `Every named technique of Bang's Water Stream Rock Smashing
# Fist` and were being reported as unlinked pages.
#
# `battle` is left alone: its 133 pages really are fights.
semantic_types:
  combat: technique

# The wiki's display title, declared because the campaign phrases every
# question "…in One-Punch Man?" and `battle_result` scores a fight row against
# the question's words. Without this, `one`/`punch`/`man` from the tail of the
# question are scored as fight content on every result question. Read by
# `roster.battle_result` only; a wiki that keeps no battle tables never looks
# at it. Declared 2026-08-22 for the Bang page campaign revival
# ("What is the result of the battle between Bang and Fist Fight Djinn…").
series_titles:
  - One-Punch Man

# Abilities a wiki only shows happening: REFUTED 2026-08-17, do not re-declare.
#
# `ability_narrative_types` read chapter and episode pages instead of character
# pages. It was built for two Chainsaw Man gold items and measured on csm, the
# cheapest wiki that holds them: 904 passages, 927 windows, 37 rows.
#
#   csm recall     144/146 (98.6%) -> 144/146 (98.6%)   no item recovered
#   csm precision            80.4% ->          74.5%    +28 members returned
#
# It cost 5.9 points of precision and recovered nothing, so the rows were
# deleted and every declaration removed. Three separate reasons, any one of
# which is enough:
#
# * **Both motivating items are somewhere else.** Makima's Prime Minister
#   contract is on her own page under a declared `Abilities` section, where the
#   model correctly answers `{"abilities": []}` because the wiki never names
#   the contract -- `Prime Minister Contract` is the bank's coinage. Power's
#   blood weapons are on `Power/History`, a page type this never read.
# * **A story summary names the wrong things.** Chapter summaries gave Denji
#   six namings of one transformation (`Chainsaw`, `Chainsaw form`,
#   `Chainsaw Devil`, `Chainsaw Man`, `Denji Man`, and `Denji` itself), which
#   is what took `Every form of Denji` from 57.1% to 28.6% precision.
# * **Attribution is not safe in narration.** `Blood weapons` was stored
#   against Makima, from a passage that names her while describing Power's.
#
# The pass itself stays in the tree, tested and working: it is one line of YAML
# from being live if a wiki is ever found whose abilities genuinely exist only
# in its story pages. Chainsaw Man is not that wiki, and it was chosen as the
# best case.
# Universal dataset (plan/UNIVERSAL_DATASET_PLAN.md, 2026-10-04, decision 1):
# one verb inventory for every wiki -- the shared 9 plus these outcome verbs.
# A student trained across wikis sees one inventory and never has to learn
# when a verb is forbidden; the outcome verbs carry the match-up brain goal.
events:
  extra_verbs: [defeated, captured, escaped]

# Chapter <-> episode adaptation (retrieve/citations.declared_episode_map).
# Both ends state it: a chapter's infobox `anime episode`, an episode's
# `chapters`. Numbers come from the "Chapter N" / "Episode N" titles; named
# bonus chapters ("A New Wind Blows") carry no number and map to nothing.
episode_map:
  links:
    - {relation: anime episode, from: chapter}
    - {relation: chapters, from: episode}
  chapter_number: [title]
  episode_number: [title]

# Sections the default boilerplate list drops that this wiki writes as content
# (chunk-containment, scratch re-index 2026-10-06: these closed the residue).
content_sections:
  - notes
  - references
