# Per-wiki handling for the One-Punch Man wiki.

# This wiki labels its character hub pages (`Saitama`, `Genos`, `Garou`, ...)
# as `parent_tab` because they carry sub-tabs (`Saitama/Synopsis`,
# `Saitama/Relationships`, ...). The default subject priority has no entry for
# it, so on any question naming Saitama a battle page whose name shares a word
# (`Saitama vs. Orochi`, via the `saitama` alias) won subject resolution, and
# the router sent attribute lookups ("Why was Saitama disqualified...") down
# the narrative timeline. Character hubs outrank battles here; the rest keeps
# the default order. Declared 2026-08-21 for the Saitama page campaign.
subject_type_priority:
  - parent_tab
  - character
  - character_synopsis
  - battle
  - battle_3sides
  - event
  - story_arcs
  # The `Chapters and Volumes` list page. Without this entry `unknown` ranked
  # ahead of it, and "What is the 195th punch titled in One-Punch Man?"
  # resolved `One-Punch Man` (the series page) instead of the page that holds
  # the punch list, sending qa at the wrong document. Declared 2026-08-21 for
  # the Chapters & Volumes page campaign.
  - unknown
  - arc
  - species
  - organizations
  - organization
  - occupation
  - location
  - technique
  - combat
  - item
  - items

# One-Punch Man exists twice over: the webcomic ONE draws and the manga Murata
# redraws it from. They share a story and not a numbering, and the wiki keeps
# them apart on the reference itself:
#
#     {{ref|ch = 20|p = 27}}    manga chapter 20
#     {{ref|wch = 44}}          webcomic chapter 44
#
# Rendering both as "(Chapter N)" would put two different scenes behind the same
# tag, which is the same failure the Modulo qualifier fixes on Jujutsu Kaisen.
citation_params:
  ch: {as: chapter}
  wch: {as: chapter, work: Webcomic}
  p: {as: page}
  wp: {as: page}          # the webcomic's page, and page numbers stay out of prose
  vol: {as: volume}

# Deliberately unmapped: `cep`, which appears twice on the whole wiki alongside
# `ch` and whose meaning is not recoverable from usage. Guessing it is an episode
# would put a number nobody verified into a script.

# The sets this wiki maintains. "Monster" is the one that matters most and the
# one discovery could never find: the wiki files them under Mysterious Beings,
# and scoring "monster" against category names picked Monster Association (71)
# over the real set of 219.
# Saitama's eleven `users` edges point at ten battles and one item, so
# ownership answers nothing here. His techniques are named in the prose under
# `Abilities and Powers / Fighting Style`.
ability_sections:
  technique: [Abilities and Powers]

