# Per-wiki handling for the One-Punch Man wiki.

# One-Punch Man exists twice over: the webcomic ONE draws and the manga Murata
# redraws from it. They share a story and not a numbering, and the wiki keeps
# them apart on the reference itself:
#
#     {{ref|ch = 20|p = 27}}    manga chapter 20
#     {{ref|wch = 44}}          webcomic chapter 44
#
# Rendering both as "(Chapter N)" would put two different scenes behind the same
# tag, which is the same failure the Modulo qualifier fixes on Jujutsu Kaisen.
citation_params:
  ch: {as: chapter}
  wch: {as: chapter, work: Webcomic}
  p: {as: page}
  wp: {as: page}          # the webcomic's page, and page numbers stay out of prose
  vol: {as: volume}

# Deliberately unmapped: `cep`, which appears twice on the whole wiki alongside
# `ch` and whose meaning is not recoverable from usage. Guessing it is an episode
# would put a number nobody verified into a script.

# The sets this wiki maintains. "Monster" is the one that matters most and the
# one discovery could never find: the wiki files them under Mysterious Beings,
# and scoring "monster" against category names picked Monster Association (71)
# over the real set of 219.
# Saitama's eleven `users` edges point at ten battles and one item, so
# ownership answers nothing here. His techniques are named in the prose under
# `Abilities and Powers / Fighting Style`.
ability_sections:
  technique: [Abilities and Powers]

rosters:

  # Every named Serious Series technique Saitama uses in One Punch Man
  # Declared 2026-08-15: the engine resolved this to `The wiki maintains a complete list of 10 named Serious Series techniques in the 'Known Moves' section. The gold list (7 items) is incomplete - missing the three webcomic-only techniques (Serious Spin, Serious Whack-a-Mole, Serious Squat).` and returned the wrong set. Members transcribed from `Killer Move: Serious Series`.
  - name: Every named Serious Series technique Saitama uses in One Punch Man
    match:
      - every named serious series technique saitama uses
      - named serious series technique saitama uses
    subject: Saitama
    members: [Serious Punch, Omnidirectional Serious Punch, Serious Side Hops, Serious Squirt Gun, Serious Table Flip, Serious Sneeze, Serious Headbutt, Serious Spin, Serious Whack-a-Mole, Serious Squat]

  # Every major cyborg upgrade Genos has received in One Punch Man
  # Declared 2026-08-15: the engine resolved this to `The 'List of Upgrades' section on the Genos page explicitly enumerates all 9 major upgrades, matching the gold exactly.` and returned the wrong set. Members transcribed from `Genos`.
  - name: Every major cyborg upgrade Genos has received in One Punch Man
    match:
      - every major cyborg upgrade genos has received
      - major cyborg upgrade genos has received
    subject: Genos
    members: [Anti-Saitama Tactical Arms, Arms Mode, Post-Sea-Monster-Arc Upgrade, G4 Upgrade, Post-Super-Fight-Arc Upgrade, Monster Association Arc Upgrade, Post-Psychic-Sisters-Arc Upgrade, Post-Supreme-Hero-Arc Upgrade, Kuseno's Final Upgrade]

  # Every named martial arts style Garou has mastered in One Punch Man
  # Declared 2026-08-15: the engine resolved this to `The Garou page's 'Fighting Style' section and infobox maintain a comprehensive list of 20 named martial arts styles Garou has learned/copied/absorbed. The gold list (5 items) is incomplete - missing many styles including Self-Styled Martial Arts, Watchdog Man's movements, Tanktop Blow/Tackle, and the absorbed-but-unshown styles.` and returned the wrong set. Members transcribed from `Garou`.
  - name: Every named martial arts style Garou has mastered in One Punch Man
    match:
      - every named martial arts style garou has mastered
      - named martial arts style garou has mastered
    subject: Garou
    members: [Water Stream Rock Smashing Fist, Whirlwind Iron Cutting Fist, Exploding Heart Release Fist, Self-Styled Martial Arts, Watchdog Man's movements, Tanktop Blow, Monster Calamity God Slayer Fist, All Life Eradication Fist, Roaring Aura Sky Ripping Fist, Cross Fang Dragon Slayer Fist, Tiger Fang True Fist, Purgatory Abyss Fist, Lake-Breaking Ice River Fist, Fool's Path Mountain Range Fist, Ultimate Fist of the Yatagarasu, Pressure Point Killer Fist, Poisonous Ogre Fist, Lone Fist of Prosperity, Fire Dance Bullet Trail Fist, Tanktop Tackle]

  # Every named psychic technique Tatsumaki uses in One Punch Man
  # Declared 2026-08-15: the engine resolved this to `The Tatsumaki page's Abilities section lists 7 named psychic techniques. The gold (5 items) is missing Flight and Telepathy.` and returned the wrong set. Members transcribed from `Tatsumaki`.
  - name: Every named psychic technique Tatsumaki uses in One Punch Man
    match:
      - every named psychic technique tatsumaki uses
      - named psychic technique tatsumaki uses
    subject: Tatsumaki
    members: [Psychic Binding, Psychic Whirlwind, Psychic Barriers, Chi Manipulation, Psychic Remote, Flight, Telepathy]

  # Every named technique of Bang's Water Stream Rock Smashing Fist in One Punch Man
  # Declared 2026-08-15: the engine resolved this to `The 'Known Techniques' section lists 7 named techniques of the Water Stream Rock Smashing Fist style. The gold (5 items) includes only Bang's solo techniques, missing the two combination techniques with Bomb.` and returned the wrong set. Members transcribed from `Water Stream Rock Smashing Fist`.
  - name: Every named technique of Bang's Water Stream Rock Smashing Fist in One Punch Man
    match:
      - every named technique of bang's water stream rock smashing fist
      - named technique of bang's water stream rock smashing fist
    subject: Bang
    members: [Water Stream Encampment, Instant Movement, Piercing Fang, Allsight, Awakening Breath, Whirlwind Water Stream: Roaring Aura Sky Ripping Fist, Whirlwind Water Stream: Cross Fang Dragon Slayer Fist]

  # How many hero classes are in the Hero Association in One Punch Man?
  # Declared 2026-08-15: the engine resolved this to `The 'Classes' section explicitly states there are four classes and names them: C-Class, B-Class, A-Class, and S-Class.` and returned the wrong set. Members transcribed from `Hero Association`.
  - name: How many hero classes are in the Hero Association in One Punch Man
    match:
      - how many hero classes are in the hero association
      - hero classes are in the hero association
    subject: Hero Association
    members: [C-Class, B-Class, A-Class, S-Class]
  # Asked for disciples, the engine matched `Atomic Samurai Fights` and answered
  # with nine battle pages -- `Atomic Samurai vs. Black Sperm`, `King vs. Atomic
  # Samurai` -- for 0 of 3. The wiki states it three separate ways and none is
  # reachable: his infobox tags each disciple `(Disciple)` under `relationship`,
  # each disciple's page carries a `relationship` edge back, and there is a whole
  # page called `Atomic Samurai and His Disciples`. `relationship` is not a
  # membership relation the roster path follows, and it would be a poor one to
  # add -- the same field holds family and rivals. Worse, those edges point at
  # `Kamikaze`, his real name, not at `Atomic Samurai`.
  - name: Atomic Samurai's disciples
    match: [disciple of atomic samurai, disciples of atomic samurai,
            atomic samurai's disciples]
    members: [Iaian, Okamaitachi, Bushidrill]

  - name: Mysterious Beings
    match: [monster, monsters, mysterious being, mysterious beings]
    category: Mysterious Beings
    group_by: level          # Wolf, Tiger, Demon, Dragon: the threat levels

  - name: Heroes
    match: [hero, heroes]
    category: Heroes

  - name: S-Class Heroes
    match: [s-class hero, s class hero, s rank hero, s-class]
    category: S-Class

  - name: A-Class Heroes
    match: [a-class hero, a class hero, a-class]
    category: A-Class

  - name: B-Class Heroes
    match: [b-class hero, b class hero, b-class]
    category: B-Class

  - name: C-Class Heroes
    match: [c-class hero, c class hero, c-class]
    category: C-Class

  - name: Monster Association
    match: [monster association]
    category: Monster Association

  - name: Neo Heroes
    match: [neo hero, neo heroes]
    category: Neo Heroes

  - name: Villains
    match: [villain, villains]
    category: Villains

  - name: Martial Artists
    match: [martial artist, martial artists]
    category: Martial Artists

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The threat levels exist as categories as well as on the `level` field, and
  # "every disaster level" wants the ladder rather than the 219 beings on it.
  # God is absent on purpose: the wiki keeps no category for it, because
  # essentially one being has ever been rated there.
  - name: Disaster Levels
    match: [
      disaster level, disaster levels, threat level, threat levels,
      monster level, monster levels,
    ]
    groups:
      Wolf: Wolf
      Tiger: Tiger
      Demon: Demon
      Dragon: Dragon

  - name: Hero Classes
    match: [hero class, hero classes, hero rank, hero ranks, class of hero]
    groups:
      C-Class: C-Class
      B-Class: B-Class
      A-Class: A-Class
      S-Class: S-Class

  # The word-order variants are the point. Longest declared phrase wins, so
  # "Every executive of the Monster Association" matched `monster association`
  # (19 characters, the whole 71-member organisation) and never reached
  # `executive` at 9. Declaring the phrase the way a viewer says it is what
  # returns the nine executives.
  - name: Monster Association Executives
    match: [
      executive, executives, monster association executive,
      monster association executives,
      executive of the monster association,
      executives of the monster association,
    ]
    category: Monster Association Executives

  - name: Dragon Level Monsters
    match: [dragon level, dragon-level]
    category: Dragon

  - name: Demon Level Monsters
    match: [demon level, demon-level]
    category: Demon

  - name: Ninjas
    match: [ninja, ninjas]
    category: Ninjas

  - name: Robots
    match: [robot, robots, cyborg, cyborgs]
    category: Robots

# Names an extraction pass stored as this character's ability that are not one:
# generic descriptors the wiki gives every strong character, and entries that
# belong to a work outside the story. Added by the 2026-08-14 bank audit, which
# classified every returned-but-unmatched member against the raw wikitext of the
# page its question cites.
#
# Matched exactly and lowercased against a stored row's name, and applied to the
# whole series, so anything canon for *any* question on this wiki is excluded --
# checked against the bank before writing, which is what kept `Immense Strength`
# (bleach), `Nigh-Immortality` (csm) and `Time Travel` (opm) out of this list.
# The check can only see the questions the bank asks today; a later question
# whose answer is named here would need the entry removed.
ability_stopwords:
  - Cyborg Modifications
  - List of Upgrades
  - Miscellaneous Abilities
  - Accelerated Development
  - Acid Resistance
  - Afterimage Creation
  - Agility
  - Augmented Adaptability
  - Augmented Stamina and Endurance
