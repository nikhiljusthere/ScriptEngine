# Per-wiki handling for the One-Punch Man wiki.

# One-Punch Man exists twice over: the webcomic ONE draws and the manga Murata
# redraws from it. They share a story and not a numbering, and the wiki keeps
# them apart on the reference itself:
#
#     {{ref|ch = 20|p = 27}}    manga chapter 20
#     {{ref|wch = 44}}          webcomic chapter 44
#
# Rendering both as "(Chapter N)" would put two different scenes behind the same
# tag, which is the same failure the Modulo qualifier fixes on Jujutsu Kaisen.
citation_params:
  ch: {as: chapter}
  wch: {as: chapter, work: Webcomic}
  p: {as: page}
  wp: {as: page}          # the webcomic's page, and page numbers stay out of prose
  vol: {as: volume}

# Deliberately unmapped: `cep`, which appears twice on the whole wiki alongside
# `ch` and whose meaning is not recoverable from usage. Guessing it is an episode
# would put a number nobody verified into a script.

# The sets this wiki maintains. "Monster" is the one that matters most and the
# one discovery could never find: the wiki files them under Mysterious Beings,
# and scoring "monster" against category names picked Monster Association (71)
# over the real set of 219.
# Saitama's eleven `users` edges point at ten battles and one item, so
# ownership answers nothing here. His techniques are named in the prose under
# `Abilities and Powers / Fighting Style`.
ability_sections:
  technique: [Abilities and Powers]

rosters:
  # Asked for disciples, the engine matched `Atomic Samurai Fights` and answered
  # with nine battle pages -- `Atomic Samurai vs. Black Sperm`, `King vs. Atomic
  # Samurai` -- for 0 of 3. The wiki states it three separate ways and none is
  # reachable: his infobox tags each disciple `(Disciple)` under `relationship`,
  # each disciple's page carries a `relationship` edge back, and there is a whole
  # page called `Atomic Samurai and His Disciples`. `relationship` is not a
  # membership relation the roster path follows, and it would be a poor one to
  # add -- the same field holds family and rivals. Worse, those edges point at
  # `Kamikaze`, his real name, not at `Atomic Samurai`.
  - name: Atomic Samurai's disciples
    match: [disciple of atomic samurai, disciples of atomic samurai,
            atomic samurai's disciples]
    members: [Iaian, Okamaitachi, Bushidrill]

  - name: Mysterious Beings
    match: [monster, monsters, mysterious being, mysterious beings]
    category: Mysterious Beings
    group_by: level          # Wolf, Tiger, Demon, Dragon: the threat levels

  - name: Heroes
    match: [hero, heroes]
    category: Heroes

  - name: S-Class Heroes
    match: [s-class hero, s class hero, s rank hero, s-class]
    category: S-Class

  - name: A-Class Heroes
    match: [a-class hero, a class hero, a-class]
    category: A-Class

  - name: B-Class Heroes
    match: [b-class hero, b class hero, b-class]
    category: B-Class

  - name: C-Class Heroes
    match: [c-class hero, c class hero, c-class]
    category: C-Class

  - name: Monster Association
    match: [monster association]
    category: Monster Association

  - name: Neo Heroes
    match: [neo hero, neo heroes]
    category: Neo Heroes

  - name: Villains
    match: [villain, villains]
    category: Villains

  - name: Martial Artists
    match: [martial artist, martial artists]
    category: Martial Artists

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The threat levels exist as categories as well as on the `level` field, and
  # "every disaster level" wants the ladder rather than the 219 beings on it.
  # God is absent on purpose: the wiki keeps no category for it, because
  # essentially one being has ever been rated there.
  - name: Disaster Levels
    match: [
      disaster level, disaster levels, threat level, threat levels,
      monster level, monster levels,
    ]
    groups:
      Wolf: Wolf
      Tiger: Tiger
      Demon: Demon
      Dragon: Dragon

  - name: Hero Classes
    match: [hero class, hero classes, hero rank, hero ranks, class of hero]
    groups:
      C-Class: C-Class
      B-Class: B-Class
      A-Class: A-Class
      S-Class: S-Class

  # The word-order variants are the point. Longest declared phrase wins, so
  # "Every executive of the Monster Association" matched `monster association`
  # — 19 characters, the whole 71-member organisation — and never reached
  # `executive` at 9. Declaring the phrase the way a viewer says it is what
  # returns the nine executives.
  - name: Monster Association Executives
    match: [
      executive, executives, monster association executive,
      monster association executives,
      executive of the monster association,
      executives of the monster association,
    ]
    category: Monster Association Executives

  - name: Dragon Level Monsters
    match: [dragon level, dragon-level]
    category: Dragon

  - name: Demon Level Monsters
    match: [demon level, demon-level]
    category: Demon

  - name: Ninjas
    match: [ninja, ninjas]
    category: Ninjas

  - name: Robots
    match: [robot, robots, cyborg, cyborgs]
    category: Robots

# Names an extraction pass stored as this character's ability that are not one:
# generic descriptors the wiki gives every strong character, and entries that
# belong to a work outside the story. Added by the 2026-08-14 bank audit, which
# classified every returned-but-unmatched member against the raw wikitext of the
# page its question cites.
#
# Matched exactly and lowercased against a stored row's name, and applied to the
# whole series, so anything canon for *any* question on this wiki is excluded --
# checked against the bank before writing, which is what kept `Immense Strength`
# (bleach), `Nigh-Immortality` (csm) and `Time Travel` (opm) out of this list.
# The check can only see the questions the bank asks today; a later question
# whose answer is named here would need the entry removed.
ability_stopwords:
  - Accelerated Development
  - Acid Resistance
  - Afterimage Creation
  - Agility
  - Augmented Adaptability
  - Augmented Stamina and Endurance
  - Augmented Strength
  - Carnivorous Consumption
