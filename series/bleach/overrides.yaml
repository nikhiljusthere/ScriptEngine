# Per-wiki handling for the Bleach wiki.

# Bleach cites in prose inside an HTML `<ref>` tag rather than through a
# template:
#
#     <ref name="e179">''Bleach'' anime, Episode 179</ref>
#     <ref>''Bleach'' manga; Chapter 686, pages 4-5</ref>
#     <ref name="e179"/>                                  (a reuse, body empty)
#
# The rules below read the locator out of that prose. Whatever they do not match
# renders as nothing, which is the right answer for the interviews, cover images
# and shop listings the wiki also cites. Before this, `<ref>` bodies survived
# into the prose and landed in the middle of the sentence they were citing:
# "Ichigo fights. Bleach anime, Episode 179 He wins."
#
# The anime rule comes first because a ref naming an episode never also names a
# chapter, while the reverse pattern would match the word "Chapter" anywhere.
citation_ref_tags:
  - match: 'anime,?\s*Episode\s+([\d.\-]+)'
    as: episode
  # "Chapter imaginary number 1" is a real Bleach numbering for its -1xx
  # chapters, and the digits after it are the ones the wiki means.
  - match: '[Cc]hapter\s+(?:imaginary number\s+)?([\d.\-]+)'
    as: chapter

# Pages that never belong in a script: video games, soundtrack pages and the
# wiki's own music pages. Removed by `prune`; brought back only by an explicit
# `crawl --refresh`.
prune_types:
  - games
  - music
  - bleach_wiki_music

# The sets this wiki maintains.
#
# Note what is absent: there is no Bankai set. The wiki files 115 pages under
# `Zanpakutō techniques` and leaves `Bankai` as a category of one.
#
# `bankai` and `shikai` used to be declared here so the topic reached the
# technique set. Measured, that answered "Every Bankai" with all 115 techniques
# and called it `declared`: a wrong answer wearing full confidence, which is
# the failure this whole pass exists to remove. Undeclared, the topic resolves
# to `Zanpakutō`, seven pages, and reports `weak`. Seven flagged is not an
# answer either, but it does not claim to be.
# This wiki keeps one user edge for Ichigo across the whole corpus, so his
# forms and techniques come from his own page. The headings are broad
# (`Powers & Abilities / Zanpakutō`) and the named forms sit in the prose.
ability_sections:
  transformation: [Powers & Abilities, Former Powers & Abilities]
  technique: [Powers & Abilities, Former Powers & Abilities]

rosters:

  # Every dance of Rukia's Shikai Sode no Shirayuki
  # Declared 2026-08-15: the engine resolved this to `The page has a dedicated section listing all three Shikai dances with their Japanese names and translations` and returned the wrong set. Members transcribed from `Rukia Kuchiki`.
  - name: Every dance of Rukia's Shikai Sode no Shirayuki
    match:
      - every dance of rukia's shikai sode no shirayuki
      - dance of rukia's shikai sode no shirayuki
    subject: Rukia Kuchiki
    # Quoted because each name contains a comma. Unquoted in an inline list,
    # YAML read these three dances as six members -- `Some no mai`,
    # `Tsukishiro`, `Tsugi no mai` ... -- and the question scored zero with
    # every member wrong. Unlike the colon case the loader cannot repair this:
    # YAML really did produce six strings and nothing can tell it should be
    # three.
    members: ["Some no mai, Tsukishiro", "Tsugi no mai, Hakuren", "San no mai, Shirafune"]

  # Every named Bankai technique Byakuya uses
  # Declared 2026-08-15: the engine resolved this to `The Bankai section of the page lists all four named Bankai techniques in a structured format` and returned the wrong set. Members transcribed from `Byakuya Kuchiki`.
  - name: Every named Bankai technique Byakuya uses
    match:
      - every named bankai technique byakuya uses
      - named bankai technique byakuya uses
    subject: Byakuya Kuchiki
    members: [Gōkei, Senkei, Ikka Senjinka, Shūkei: Hakuteiken]

  # Every position Aizen has held
  # Declared 2026-08-15: the engine resolved this to `The infobox 'previous position' field lists all four positions Aizen has held` and returned the wrong set. Members transcribed from `Sosuke Aizen`.
  - name: Every position Aizen has held
    match:
      - every position aizen has held
      - position aizen has held
    subject: Sosuke Aizen
    members: [Captain of the 5th Division, Lieutenant of the 5th Division, Leader of the Arrancar Army]

  # Who are the Schutzstaffel members?
  # Declared 2026-08-15: the engine resolved this to `The page has a 'Members' section with a structured table listing all five current Schutzstaffel members` and returned the wrong set. Members transcribed from `Schutzstaffel`.
  - name: Who are the Schutzstaffel members
    match:
      - who are the schutzstaffel members
      - the schutzstaffel members
      - schutzstaffel members
    members: [Lille Barro, Gerard Valkyrie, Pernida Parnkgjas, Askin Nakk Le Vaar, Uryū Ishida]

  # Every current Espada
  # Declared 2026-08-16: the question says "the ten active Espada of Aizen's
  # Arrancar army", and `Arrancar` and `Espada` are both declared with a
  # one-word match, so `Arrancar` won on a tie and answered with nine of the
  # wrong people. Falling back to the `Espada` category is no better -- it holds
  # 25, including Privaron Espada and Expanded Universe pages.
  #
  # Members transcribed from the `Notable Members` table on `Espada`, which
  # lists twelve entries for ten ranks because Tres and Sexta each name a former
  # holder beside the current one: Nelliel Tu Odelschwanck was the third before
  # Tier Harribel, and Luppi Antenor the sixth before Grimmjow reclaimed it
  # (Chapter 229). Those two are what separate this set from `the Espada
  # members`, which counts eleven.
  - name: The current Espada
    match:
      - every current espada
      - current espada
      - ten active espada
      - espada of aizen's arrancar army
    members: [Yammy Llargo, Coyote Starrk, Baraggan Louisenbairn, Tier Harribel, Ulquiorra Cifer, Nnoitra Gilga, Grimmjow Jaegerjaquez, Zommari Rureaux, Szayelaporro Granz, Aaroniero Arruruerie]



  - name: Espada
    match: [espada]
    category: Espada

  - name: Gotei 13
    match: [gotei 13, gotei thirteen, gotei]
    category: Gotei 13

  # The compound phrases are declared because the longest match wins, and
  # "Every Captain of the Gotei 13" names both sets. Without them the topic
  # resolved to all 127 members of the Gotei 13 rather than its 27 captains.
  - name: Shinigami Captains
    match: [
      captain, captains, shinigami captain, shinigami captains,
      captain of the gotei 13, captains of the gotei 13, gotei 13 captain,
      gotei 13 captains,
    ]
    category: Shinigami captains

  - name: Zanpakuto Techniques
    match: [zanpakuto, zanpakutō, zanpakuto technique]
    category: Zanpakutō techniques

  - name: Kido
    match: [kido, kidō, spell, spells]
    category: Kidō

  - name: Hollows
    match: [hollow, hollows]
    category: Hollow

  - name: Arrancar
    match: [arrancar]
    category: Arrancar

  - name: Visored
    match: [visored, vizard, vizards]
    category: Visored

  - name: Quincy
    match: [quincy, quincies]
    category: Quincy

  - name: Vasto Lorde
    match: [vasto lorde]
    category: Vasto Lorde

  - name: Shinigami
    match: [shinigami, soul reaper, soul reapers]
    category: Shinigami

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Gotei 13 is thirteen divisions, and "every division" wants the thirteen
  # with their members, not the 127 shinigami in one flat list. Declared in
  # order, because `groups:` preserves it and 1st-through-13th is the order the
  # series uses.
  - name: Divisions of the Gotei 13
    match: [
      division, divisions, gotei division, gotei divisions,
      division of the gotei 13, divisions of the gotei 13,
      squad, squads,
    ]
    groups:
      1st Division: 1st Division
      2nd Division: 2nd Division
      3rd Division: 3rd Division
      4th Division: 4th Division
      5th Division: 5th Division
      6th Division: 6th Division
      7th Division: 7th Division
      8th Division: 8th Division
      9th Division: 9th Division
      10th Division: 10th Division
      11th Division: 11th Division
      12th Division: 12th Division
      13th Division: 13th Division

  # Hollows evolve through named stages, so "every type of hollow" is the
  # ladder rather than the 82 individuals on it.
  - name: Hollow Evolution
    match: [
      hollow evolution, type of hollow, types of hollow, hollow type,
      hollow types, hollow stage, hollow stages,
    ]
    groups:
      Menos Grande: Menos Grande
      Adjuchas: Adjuchas
      Vasto Lorde: Vasto Lorde
      Arrancar: Arrancar
      Espada: Espada

  - name: Sternritter
    match: [sternritter, quincy soldier, quincy soldiers]
    category: Sternritter

  - name: Fraccion
    match: [fraccion, fraccions, fracción]
    category: Fraccions

  - name: Royal Guard
    match: [royal guard, royal guards, zero division, squad zero]
    category: Royal Guard

  - name: Fullbringers
    match: [fullbringer, fullbringers, fullbring]
    category: Fullbringer

  - name: Menos Grande
    match: [menos, menos grande, gillian]
    category: Menos Grande

  - name: Adjuchas
    match: [adjuchas]
    category: Adjuchas

# Names an extraction pass stored as this character's ability that are not one:
# generic descriptors the wiki gives every strong character, and entries that
# belong to a work outside the story. Added by the 2026-08-14 bank audit, which
# classified every returned-but-unmatched member against the raw wikitext of the
# page its question cites.
#
# Matched exactly and lowercased against a stored row's name, and applied to the
# whole series, so anything canon for *any* question on this wiki is excluded --
# checked against the bank before writing, which is what kept `Immense Strength`
# (bleach), `Nigh-Immortality` (csm) and `Time Travel` (opm) out of this list.
# The check can only see the questions the bank asks today; a later question
# whose answer is named here would need the entry removed.
ability_stopwords:
  - Natural Abilities
  - Quincy Powers & Abilities
  - Bankai Special Ability
  - Former Powers & Abilities
  - Powers & Abilities
  - Bilingual
  - Enhanced Bankai Duration
  - Enhanced Durability
  - Enhanced Hierro
  - Enhanced Pesquisa
  - Enhanced Reflexes
  - Enhanced Speed
  - Enhanced Spiritual Power
  - Greater Enhanced Sonido
  - Greater Enhanced Strength
  - Hollow Combat
  - Hyper-Speed Combat
  - Master Hand-to-Hand Combatant
  - Power Augmentation
  - Reiatsu
  - Sonído Master
  - Way of Onmitsu


# Headings that name a real ability even though many pages carry them.
# `_drop_templates` removes any heading shared by more than ten pages, because
# `Zanpakutō` and `Nen` are scaffolding on hundreds. These are not: a stat-line
# is shared by 81 pages because 81 characters have enhanced strength, and every
# name below is canon for at least one question in this series' bank. Nesting
# cannot tell the two apart -- `Zanpakutō` is a childless leaf too -- so the
# series declares them.
ability_headings:
