# Per-wiki handling for the Bleach wiki.

# Bleach cites in prose inside an HTML `<ref>` tag rather than through a
# template:
#
#     <ref name="e179">''Bleach'' anime, Episode 179</ref>
#     <ref>''Bleach'' manga; Chapter 686, pages 4-5</ref>
#     <ref name="e179"/>                                  (a reuse, body empty)
#
# The rules below read the locator out of that prose. Whatever they do not match
# renders as nothing, which is the right answer for the interviews, cover images
# and shop listings the wiki also cites. Before this, `<ref>` bodies survived
# into the prose and landed in the middle of the sentence they were citing:
# "Ichigo fights. Bleach anime, Episode 179 He wins."
#
# The anime rule comes first because a ref naming an episode never also names a
# chapter, while the reverse pattern would match the word "Chapter" anywhere.
citation_ref_tags:
  - match: 'anime,?\s*Episode\s+([\d.\-]+)'
    as: episode
  # "Chapter imaginary number 1" is a real Bleach numbering for its -1xx
  # chapters, and the digits after it are the ones the wiki means.
  - match: '[Cc]hapter\s+(?:imaginary number\s+)?([\d.\-]+)'
    as: chapter

# The sets this wiki maintains.
#
# Note what is absent: there is no Bankai set. The wiki files 115 pages under
# `Zanpakutō techniques` and leaves `Bankai` as a category of one, so "every
# bankai" is answered with the technique set rather than a curated list that
# does not exist. Discovery answered it with the `Bleach` series page.
rosters:
  - name: Espada
    match: [espada]
    category: Espada

  - name: Gotei 13
    match: [gotei 13, gotei thirteen, gotei]
    category: Gotei 13

  # The compound phrases are declared because the longest match wins, and
  # "Every Captain of the Gotei 13" names both sets. Without them the topic
  # resolved to all 127 members of the Gotei 13 rather than its 27 captains.
  - name: Shinigami Captains
    match: [
      captain, captains, shinigami captain, shinigami captains,
      captain of the gotei 13, captains of the gotei 13, gotei 13 captain,
      gotei 13 captains,
    ]
    category: Shinigami captains

  - name: Zanpakuto Techniques
    match: [zanpakuto, zanpakutō, bankai, shikai, zanpakuto technique]
    category: Zanpakutō techniques

  - name: Kido
    match: [kido, kidō, spell, spells]
    category: Kidō

  - name: Hollows
    match: [hollow, hollows]
    category: Hollow

  - name: Arrancar
    match: [arrancar]
    category: Arrancar

  - name: Visored
    match: [visored, vizard, vizards]
    category: Visored

  - name: Quincy
    match: [quincy, quincies]
    category: Quincy

  - name: Vasto Lorde
    match: [vasto lorde]
    category: Vasto Lorde

  - name: Shinigami
    match: [shinigami, soul reaper, soul reapers]
    category: Shinigami

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Gotei 13 is thirteen divisions, and "every division" wants the thirteen
  # with their members, not the 127 shinigami in one flat list. Declared in
  # order, because `groups:` preserves it and 1st-through-13th is the order the
  # series uses.
  - name: Divisions of the Gotei 13
    match: [
      division, divisions, gotei division, gotei divisions,
      division of the gotei 13, divisions of the gotei 13,
      squad, squads,
    ]
    groups:
      1st Division: 1st Division
      2nd Division: 2nd Division
      3rd Division: 3rd Division
      4th Division: 4th Division
      5th Division: 5th Division
      6th Division: 6th Division
      7th Division: 7th Division
      8th Division: 8th Division
      9th Division: 9th Division
      10th Division: 10th Division
      11th Division: 11th Division
      12th Division: 12th Division
      13th Division: 13th Division

  # Hollows evolve through named stages, so "every type of hollow" is the
  # ladder rather than the 82 individuals on it.
  - name: Hollow Evolution
    match: [
      hollow evolution, type of hollow, types of hollow, hollow type,
      hollow types, hollow stage, hollow stages,
    ]
    groups:
      Menos Grande: Menos Grande
      Adjuchas: Adjuchas
      Vasto Lorde: Vasto Lorde
      Arrancar: Arrancar
      Espada: Espada

  - name: Sternritter
    match: [sternritter, quincy soldier, quincy soldiers]
    category: Sternritter

  - name: Fraccion
    match: [fraccion, fraccions, fracción]
    category: Fraccions

  - name: Royal Guard
    match: [royal guard, royal guards, zero division, squad zero]
    category: Royal Guard

  - name: Fullbringers
    match: [fullbringer, fullbringers, fullbring]
    category: Fullbringer

  - name: Menos Grande
    match: [menos, menos grande, gillian]
    category: Menos Grande

  - name: Adjuchas
    match: [adjuchas]
    category: Adjuchas
