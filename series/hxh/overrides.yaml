# Per-wiki handling for Hunterpedia.

# The films are not canon here (Togashi did not write them) so an answer about
# the story should not contain Omokage, an original character from *Phantom
# Rouge* whom the wiki files with the Phantom Troupe. Dragon Ball's films are
# canon, which is why the default includes them and this wiki overrides it.
canon_media: [manga, anime]

# Hunterpedia cites in prose inside an HTML `<ref>` tag, and reuses each one by
# name heavily: 243 reuses against 141 definitions in a 19-page sample, so
# reading only the definition sites would leave most cited lines unsourced:
#
#     <ref name="chap319">Hunter × Hunter - Volume 30, Chapter 319</ref>
#     <ref name="chap319"></ref>
#     <ref>Hunter × Hunter - Episode 58 (2011)</ref>
#
# The chapter is what a script tags with, so the volume in the same string is
# deliberately not captured.
citation_ref_tags:
  - match: '-\s*Episode\s+([\d.\-]+)'
    as: episode
  - match: 'Chapter\s+([\d.\-]+)'
    as: chapter

# Hunterpedia holds the six Nen types only as categories: no field on a
# character says which type they are. So "Every Nen Type" is a roster whose
# members are the groups themselves, which is why `groups:` exists. Discovery
# scored this topic as `Unknown Nen type users`, 247 of them, because that
# category name contains both "nen" and "type" while `Enhancers` contains
# neither.
# Hunterpedia records no `users` field on any ability, so a character's Nen is
# reachable only through their own page. The headings stop at
# `Abilities & Powers / Nen`, and the individual abilities are named in the prose
# beneath, which is what the index-time extractor reads.
# Hunterpedia spells the heading two ways: `Abilities & Powers` carries 967,457
# characters of ability prose and `Abilities and Powers` another 65,153.
# Declaring only the ampersand form left the second unreachable, which is the
# defect that hid `Rika` on the Jujutsu Kaisen wiki. Found 2026-08-16 by listing
# every top-level section on a character page that no declaration matches, worth
# redoing whenever a wiki is re-crawled.
ability_sections:
  technique: [Abilities & Powers, Abilities and Powers]
  item: [Equipment]

# The Nen system itself is not any one character's ability.
#
# Every Hunter uses Ten, Ren and Zetsu the way every swordsman uses a stance,
# and each character's ability section names them again in turn. The extractor
# is told not to return the system an ability belongs to, and for Killua it did
# not, but measured across the whole wiki, 129 of 345 extracted rows are these
# ten words, 37% of everything stored. Gon, Biscuit and Uvogin each came back
# with nine of them listed ahead of anything that is actually theirs.
#
# Declared rather than inferred: which words name the system is exactly what a
# series knows about itself, and `Every Nen type` still answers from the
# declared `Nen Types` set below.
ability_stopwords:
  - Abilities & Powers
  - Natural Abilities
  - Ten
  - Zetsu
  - Ren
  - Gyo
  - In
  - En
  - Shu
  - Ko
  - Ken
  - Ryu
  - Hatsu
  - Nen
  - Advanced Durability
  - Advanced Hearing
  - Assassination Skills
  - Enhanced Agility
  - Enhanced Endurance
  - Enhanced Stamina
  - Enhanced Strength
  - Expert in Tailing
  - Genius-Level Intellect
  - Healing Factor
  - Immense Agility
  - Immense Poison Resistance
  - Immense Speed and Reflexes
  - Master Hand-to-Hand Combatant
  - Master of Stealth
  - Master Strategist
  - Master Weapon Specialist
  - Masterful Darts Player
  - Masterful Skater
  - Muscle and Joint Control
  - Preternatural Perception
  - Resistance to Electricity
rosters:

  # What are Killua Zoldyck's named Nen techniques?
  # Declared 2026-08-15: the engine resolved this to `Wiki Abilities template lists 4 named techniques; Godspeed is the overall Hatsu encompassing Whirlwind and Speed of Lightning. Gold includes 'Thunder Palm' (alt name for Lightning Palm) and 'Godspeed' (umbrella name).` and returned the wrong set. Members transcribed from `Killua Zoldyck`.
  - name: What are Killua Zoldyck's named Nen techniques
    match:
      - what are killua zoldyck's named nen techniques
      - killua zoldyck's named nen techniques
    subject: Killua Zoldyck
    # Corrected 2026-08-16. The note above says the template lists four and
    # that Godspeed is an umbrella name; the page's own Abilities line reads
    # `Lightning Palm Thunderbolt Godspeed Whirlwind Speed of Lightning` --
    # five, with Godspeed among them, not above them. `Thunder Palm` really
    # is an alternate name for Lightning Palm and appears nowhere on the
    # wiki, so it is recorded as an alias of that item in the bank instead.
    members: [Lightning Palm, Thunderbolt, Godspeed, Whirlwind, Speed of Lightning]

  # What are Kurapika's named Nen chains?
  # Declared 2026-08-15: the engine resolved this to `Wiki Abilities template lists all 6 named chains exactly matching gold.` and returned the wrong set. Members transcribed from `Kurapika`.
  - name: What are Kurapika's named Nen chains
    match:
      - what are kurapika's named nen chains
      - kurapika's named nen chains
    subject: Kurapika
    members: [Dowsing Chain, Chain Jail, Holy Chain, Judgment Chain, Steal Chain, Stealth Dolphin]

  # What are Hisoka Morow's named Nen techniques?
  # Declared 2026-08-15: the engine resolved this to `Wiki Abilities template lists exactly 2 named techniques matching gold.` and returned the wrong set. Members transcribed from `Hisoka Morow`.
  - name: What are Hisoka Morow's named Nen techniques
    match:
      - what are hisoka morow's named nen techniques
      - hisoka morow's named nen techniques
    subject: Hisoka Morow
    members: [Bungee Gum, Texture Surprise]

  # Who are the Zodiacs of the Hunter Association?
  # Declared 2026-08-15: the engine resolved this to `Gold includes former members Ging Freecss and Pariston Hill, and Ickshonpe Katocha (not in gallery; gallery has Saiyu for Monkey). Wiki maintains current 12 in gallery template.` and returned the wrong set. Members transcribed from `Zodiacs`.
  - name: Who are the Zodiacs of the Hunter Association
    match:
      - who are the zodiacs of the hunter association
      - the zodiacs of the hunter association
      - zodiacs of the hunter association
    subject: Zodiacs
    # Widened 2026-08-16 from the gallery's current twelve to everyone the wiki
    # documents as holding a seat. The question asks who the Zodiacs *are*, and
    # Ging Freecss and Pariston Hill held one until they left; Ickshonpe Katocha
    # holds one and is simply absent from the gallery template the first
    # transcription was taken from. Declaring only the gallery scored 12/15.
    #
    # This is the current-versus-former distinction the roadmap tracks as phase
    # 20, and until that exists the honest choice is the wider set: a former
    # Zodiac is a real answer to the question, and omitting one is a silent
    # miss, while including one is visible and correctable.
    members: [Kurapika, Mizaistom Nana, Kanzai, Pyon, Botobai Gigante, Gel, Saccho Kobayakawa, Ginta, Saiyu, Cluck, Cheadle Yorkshire, Leorio Paradinight, Ging Freecss, Pariston Hill, Ickshonpe Katocha]
  - name: Nen Types
    # "levels of nen" added 2026-08-19: the router now sends a counting
    # question to this set only when it resolves one, and "How many levels of
    # Nen are there?" -- the wiki's six aura types asked with another word for
    # them -- resolved nothing and fell through to prose.
    match: [nen type, nen types, nen category, nen categories, type of nen, levels of nen]
    groups:
      Enhancer: Enhancers
      Transmuter: Transmuters
      Conjurer: Conjurers
      Manipulator: Manipulators
      Emitter: Emitters
      Specialist: Specialists

  - name: Phantom Troupe
    match: [phantom troupe, spider, spiders, genei ryodan]
    category: Phantom Troupe

  - name: Zoldyck Family
    match: [zoldyck, zoldyck family]
    category: Zoldyck Family

  - name: Chimera Ants
    match: [chimera ant, chimera ants, ant, ants]
    category: Chimera Ants

  - name: Kurta Clan
    match: [kurta, kurta clan]
    category: Kurta Clan

  - name: Greed Island Cards
    match: [greed island card, greed island cards, card, cards]
    category: Greed Island Cards

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Chimera Ant hierarchy is the point of that arc: King, Royal Guards,
  # Squadron Leaders, then the rest.
  - name: Chimera Ant Hierarchy
    match: [
      chimera ant hierarchy, ant hierarchy, chimera ant rank,
      chimera ant ranks, rank of chimera ant, ranks of chimera ant,
    ]
    groups:
      Squadron Leaders: Squadron Leaders
      Chimera Ants: Chimera Ants

  - name: Squadron Leaders
    match: [squadron leader, squadron leaders]
    category: Squadron Leaders

  - name: Zodiac Twelve
    match: [zodiac, zodiacs, zodiac twelve, twelve zodiacs]
    category: Zodiac Twelve

  - name: Nostrade Family
    match: [nostrade, nostrade family]
    category: Nostrade Family

  - name: Kakin Royal Family
    match: [kakin royal family, kakin prince, kakin princes, prince, princes]
    category: Kakin Royal Family

  # The star licences, which is what "Hunter rank" means. This pointed at
  # `Provisional`, `Unclassified` and `Amateur Hunters`: employment status, not
  # rank, and so answered the question on the wrong axis entirely.
  - name: Hunter Ranks
    match: [hunter rank, hunter ranks, kind of hunter, kinds of hunter, type of hunter]
    groups:
      Single Star: Single Star Hunters
      Double Star: Double Star Hunters
      Triple Star: Triple Star Hunters

  # Three of them, and the wiki files them nowhere: the `Royal Guards` page
  # names them in prose only, so asking by category returned all 64 Chimera Ants.
  - name: Chimera Ant Royal Guards
    match: [royal guard, royal guards, chimera ant royal guard, chimera ant royal guards]
    members: [Neferpitou, Shaiapouf, Menthuthuyoupi]

  - name: Wanted Criminals
    match: [wanted criminal, wanted criminals, criminal, criminals]
    category: Wanted Criminals

# Hunterpedia keeps `Background` for a character's own history. `Plot` holds
# 3,014 chunks of story narration and is deliberately left out for now -- it
# is where relationships happen rather than where they are described, and
# `fought once` is not `enemy`. Worth revisiting on measured output.
relation_sections:
  - Relationships
  - History
  - Background

# Abilities a wiki only shows happening: REFUTED 2026-08-17, do not re-declare.
#
# `ability_narrative_types` read chapter and episode pages instead of character
# pages. It was built for two Chainsaw Man gold items and measured on csm, the
# cheapest wiki that holds them: 904 passages, 927 windows, 37 rows.
#
#   csm recall     144/146 (98.6%) -> 144/146 (98.6%)   no item recovered
#   csm precision            80.4% ->          74.5%    +28 members returned
#
# It cost 5.9 points of precision and recovered nothing, so the rows were
# deleted and every declaration removed. Three separate reasons, any one of
# which is enough:
#
# * **Both motivating items are somewhere else.** Makima's Prime Minister
#   contract is on her own page under a declared `Abilities` section, where the
#   model correctly answers `{"abilities": []}` because the wiki never names
#   the contract -- `Prime Minister Contract` is the bank's coinage. Power's
#   blood weapons are on `Power/History`, a page type this never read.
# * **A story summary names the wrong things.** Chapter summaries gave Denji
#   six namings of one transformation (`Chainsaw`, `Chainsaw form`,
#   `Chainsaw Devil`, `Chainsaw Man`, `Denji Man`, and `Denji` itself), which
#   is what took `Every form of Denji` from 57.1% to 28.6% precision.
# * **Attribution is not safe in narration.** `Blood weapons` was stored
#   against Makima, from a passage that names her while describing Power's.
#
# The pass itself stays in the tree, tested and working: it is one line of YAML
# from being live if a wiki is ever found whose abilities genuinely exist only
# in its story pages. Chainsaw Man is not that wiki, and it was chosen as the
# best case.
