# Per-wiki handling for Hunterpedia.

# Hunterpedia cites in prose inside an HTML `<ref>` tag, and reuses each one by
# name heavily — 243 reuses against 141 definitions in a 19-page sample, so
# reading only the definition sites would leave most cited lines unsourced:
#
#     <ref name="chap319">Hunter × Hunter - Volume 30, Chapter 319</ref>
#     <ref name="chap319"></ref>
#     <ref>Hunter × Hunter - Episode 58 (2011)</ref>
#
# The chapter is what a script tags with, so the volume in the same string is
# deliberately not captured.
citation_ref_tags:
  - match: '-\s*Episode\s+([\d.\-]+)'
    as: episode
  - match: 'Chapter\s+([\d.\-]+)'
    as: chapter

# Hunterpedia holds the six Nen types only as categories: no field on a
# character says which type they are. So "Every Nen Type" is a roster whose
# members are the groups themselves, which is why `groups:` exists. Discovery
# scored this topic as `Unknown Nen type users` — 247 of them — because that
# category name contains both "nen" and "type" while `Enhancers` contains
# neither.
rosters:
  - name: Nen Types
    match: [nen type, nen types, nen category, nen categories, type of nen]
    groups:
      Enhancer: Enhancers
      Transmuter: Transmuters
      Conjurer: Conjurers
      Manipulator: Manipulators
      Emitter: Emitters
      Specialist: Specialists

  - name: Phantom Troupe
    match: [phantom troupe, spider, spiders, genei ryodan]
    category: Phantom Troupe

  - name: Zoldyck Family
    match: [zoldyck, zoldyck family]
    category: Zoldyck Family

  - name: Chimera Ants
    match: [chimera ant, chimera ants, ant, ants]
    category: Chimera Ants

  - name: Kurta Clan
    match: [kurta, kurta clan]
    category: Kurta Clan

  - name: Greed Island Cards
    match: [greed island card, greed island cards, card, cards]
    category: Greed Island Cards

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Chimera Ant hierarchy is the point of that arc: King, Royal Guards,
  # Squadron Leaders, then the rest.
  - name: Chimera Ant Hierarchy
    match: [
      chimera ant hierarchy, ant hierarchy, chimera ant rank,
      chimera ant ranks, rank of chimera ant, ranks of chimera ant,
    ]
    groups:
      Squadron Leaders: Squadron Leaders
      Chimera Ants: Chimera Ants

  - name: Squadron Leaders
    match: [squadron leader, squadron leaders]
    category: Squadron Leaders

  - name: Zodiac Twelve
    match: [zodiac, zodiacs, zodiac twelve, twelve zodiacs]
    category: Zodiac Twelve

  - name: Nostrade Family
    match: [nostrade, nostrade family]
    category: Nostrade Family

  - name: Kakin Royal Family
    match: [kakin royal family, kakin prince, kakin princes, prince, princes]
    category: Kakin Royal Family

  - name: Hunter Ranks
    match: [hunter rank, hunter ranks, kind of hunter, kinds of hunter, type of hunter]
    groups:
      Provisional Hunters: Provisional Hunters
      Unclassified Hunters: Unclassified Hunters
      Amateur Hunters: Amateur Hunters

  - name: Wanted Criminals
    match: [wanted criminal, wanted criminals, criminal, criminals]
    category: Wanted Criminals
