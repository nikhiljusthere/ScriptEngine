  # The star licences, which is what "Hunter rank" means. This pointed at
  # `Provisional`, `Unclassified` and `Amateur Hunters` — employment status, not
  # rank — and so answered the question on the wrong axis entirely.
  - name: Hunter Ranks
    match: [hunter rank, hunter ranks, kind of hunter, kinds of hunter, type of hunter]
    groups:
      Single Star: Single Star Hunters
      Double Star: Double Star Hunters
      Triple Star: Triple Star Hunters

  # Three of them, and the wiki files them nowhere: the `Royal Guards` page
  # names them in prose only, so asking by category returned all 64 Chimera Ants.
  - name: Chimera Ant Royal Guards
    match: [royal guard, royal guards, chimera ant royal guard, chimera ant royal guards]
    members: [Neferpitou, Shaiapouf, Menthuthuyoupi]

  - name: Wanted Criminals
