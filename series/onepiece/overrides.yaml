# Per-wiki handling for the One Piece Wiki.

# This wiki barely cites its own story. 2,978 `<ref>` tags across 7,937 pages,
# and its most-referenced pages are video games, publishers and merchandise,
# Super Grand Battle X, Madman Entertainment, Scholastic. A character page
# typically carries none at all.
#
# What it has instead is 1,191 chapter pages and 1,172 episode pages, each with
# a Short Summary and a Long Summary of the actual story. That is where One
# Piece's prose lives, and the locator for those pages is the page title, which
# `citations.locator_from_title` reads directly. Cite mode falls back to it when
# a passage carries no reference of its own, so this series is sourceable
# despite citing almost nothing inline.
#
# The rules below catch the handful of real inline references anyway, since a
# reference the wiki did write is better evidence than the page it sits on:
#
#     ''One Piece'' Manga and Anime — [[Volume 61|Vol. 61]] [[Chapter 598]] and [[Episode 517]]
#     ''One Piece Manga'' - Vol. 12 [[Chapter 105]] page 4.
#
# Chapter is matched before episode because the combined form names both and the
# chapter is the more precise of the two.
citation_ref_tags:
  - match: '\[\[Chapter\s+(\d+)'
    as: chapter
  - match: 'Chapter\s+(\d+)'
    as: chapter
  - match: '\[\[Episode\s+(\d+)'
    as: episode
  - match: 'Episode\s+(\d+)'
    as: episode

# Deliberately unmatched: SBS volumes, novels, films, databooks and the long
# tail of merchandise and publisher references. They cite a real source, but not
# an instalment of the story a script can tag a line with.

# Pages that never belong in a script: the wiki's video game and soundtrack
# pages. Removed by `prune`; brought back only by an explicit `crawl --refresh`.
prune_types:
  - game_box
  - song_box
  - album_box

# The sets this wiki maintains. Every entry verified to return members.
# Where this wiki writes a character's abilities when it gives them no page.
#
# Luffy's Gears are not entities here: they are headings,
# `Devil Fruit / Gear 2` on `Monkey D. Luffy/Abilities and Powers`. Asked for
# his forms, category retrieval reached `Former Pirates` and answered with
# forty people, because nothing filed by kind can reach a heading.
#
# Keyed by the kind a topic asks for, the same way category names are.
ability_sections:
  transformation: [Devil Fruit]
  technique: [Abilities and Powers, Swordsmanship, Haki, Physical Abilities]
  item: [Weapons]

# Haki is the system, not one character's ability.
#
# Every notable fighter in the second half of the series uses Armament and
# Observation, and each character's ability section names them again: 23 of
# 412 extracted rows across 15 characters, which pushed `Armament Haki` and
# `Supreme King Haki` ahead of Zoro's actual sword techniques.
#
# The named advances are deliberately absent: `Ryuo` and `Nigori-Zake` are
# things Zoro does, not the system he does them with, and `Every type of Haki`
# still answers from the declared `Haki Types` set.
# `Haki` alone is the power system, as `Nen` and `Jujutsu` are, and stays out.
# The three *types* were taken out on 2026-08-15: they had been declared "not
# anyone's ability" while the researched gold names them as canon for four
# character questions -- `Armament Haki`, `Observation Haki` and
# `Supreme King Haki` are Zoro's abilities as much as his sword styles are. The
# stopword list and the bank disagreed, and the bank is the target. Their
# romanisations go with them, being the same three things under other names.
# The `Advanced` forms stay: no question asks for them.
ability_stopwords: [
  Haki,
  Advanced Armament Haki, Advanced Observation Haki, Advanced Conqueror's Haki,
  Speed and Agility, Durability and Endurance, Durability, Endurance, Luck, Lack of Orientation, Current Swords, Former Swords, Situational Weapons, Other Weapons, Other Techniques
]

rosters:

  # How many Sweet Commanders are in the Big Mom Pirates in One Piece?
  # Declared 2026-08-15: the engine resolved this to `The section explicitly names three current Sweet Commanders: Katakuri, Smoothie, and Cracker. Snack is mentioned as a former commander.` and returned the wrong set. Members transcribed from `Big Mom Pirates`.
  - name: How many Sweet Commanders are in the Big Mom Pirates in One Piece
    match:
      - how many sweet commanders are in the big mom pirates
      - sweet commanders are in the big mom pirates
    members: [Charlotte Katakuri, Charlotte Smoothie, Charlotte Cracker]

  # How many All-Stars are in the Beasts Pirates in One Piece?
  # Declared 2026-08-15: the engine resolved this to `The section explicitly states there are three All-Stars and names them: King, Queen, and Jack.` and returned the wrong set. Members transcribed from `Beasts Pirates`.
  - name: How many All-Stars are in the Beasts Pirates in One Piece
    match:
      - how many all-stars are in the beasts pirates
      - all-stars are in the beasts pirates
    members: [King, Queen, Jack]
  # Races span two categories the wiki keeps apart, and discovery can only pick
  # one of them: `Races and Tribes` has 21 and leaves out every artificial race.
  - name: Races and Tribes
    match: [race, races, tribe, tribes, species, non-human, non-humans, nonhuman, nonhumans]
    categories:
      - Races and Tribes
      - Artificial Races

  # Not a category on this wiki: no rank has its own article, so asking by
  # category returns `Marine Officers`, fourteen people rather than the ladder.
  # The page writes all twenty-two as sections, grouped by division.
  - name: Marine Ranks
    match: [marine rank, marine ranks, officer rank, officer ranks, rank in the marines, ranks in the marines]
    sections_of: Marine Ranks

  - name: Movies
    match: [movie, movies, film, films]
    category: One Piece Movies

  # The wiki calls them the Four Emperors; viewers say Yonko, and no scoring
  # turns one into the other. Seven pages sit in the category, more than the
  # four seats, because the title has changed hands.
  - name: Four Emperors
    match: [yonko, yonkou, emperor of the sea, emperors of the sea, four emperors]
    category: Four Emperors

  - name: Devil Fruit Types
    match: [devil fruit type, devil fruit types, type of devil fruit, types of devil fruit]
    groups:
      Paramecia: Paramecia
      Zoan: Zoan
      Logia: Logia

  - name: Paramecia Users
    match: [paramecia, paramecia user, paramecia users]
    category: Paramecia Devil Fruit Users

  - name: Logia Users
    match: [logia, logia user, logia users]
    category: Logia Devil Fruit Users

  - name: Zoan Users
    match: [zoan, zoan user, zoan users]
    category: Zoan Devil Fruit Users

  - name: Mythical Zoan Users
    match: [mythical zoan, mythical zoan user, mythical zoan users]
    category: Mythical Zoan Devil Fruit Users

  - name: Seven Warlords of the Sea
    match: [warlord, warlords, shichibukai, seven warlords, warlord of the sea]
    category: Seven Warlords of the Sea

  - name: Pirate Captains
    match: [pirate captain, pirate captains]
    category: Pirate Captains

  - name: Marine Vice Admirals
    match: [vice admiral, vice admirals, marine vice admiral]
    category: Marine Vice Admirals

  - name: Marine Rear Admirals
    match: [rear admiral, rear admirals]
    category: Marine Rear Admirals

  - name: Swordsmen
    match: [swordsman, swordsmen, swordfighter]
    category: Swordsmen

  - name: Swords
    match: [sword, swords, blade, blades]
    category: Swords

  - name: Giants
    match: [giant, giants]
    category: Giants

  - name: Revolutionary Army Commanders
    match: [revolutionary, revolutionary army, revolutionary army commander]
    category: Revolutionary Army Commanders

  # Haki is three colours, and "every type of haki" wants the three with their
  # users rather than a flat list of everyone who has any.
  - name: Haki Types
    match: [haki, haki type, haki types, type of haki, colour of haki, color of haki]
    groups:
      Observation Haki: Observation Haki Users
      Armament Haki: Armament Haki Users
      Conqueror's Haki: Supreme King Haki Users


# Headings that name a real ability even though many pages carry them.
# `Armament Haki` heads a section on 65 pages because 65 characters have Haki.
# It is a childless leaf, exactly as `Zanpakutō` and `Nen` are, so neither the
# page count nor nesting can separate them -- the series declares them instead.
ability_headings:
  - Armament Haki
  - Observation Haki
  - Supreme King Haki
  - Tactical Skills
  - Marksmanship
