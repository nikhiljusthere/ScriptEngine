    subject: Yuta Okkotsu
    members: [Copy]

  # What are all the domain expansions of Yuta Okkotsu?
  # Declared 2026-08-20 for the page campaign (`jjk-pg-yuta-003`).
  # Following the wiki's own section: `Yuta Okkotsu` lists two under
