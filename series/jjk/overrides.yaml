  - name: Every domain expansion of Yuta Okkotsu
    match: [every domain expansion of yuta okkotsu, all the domain expansions of yuta okkotsu, domain expansions of yuta okkotsu]
    subject: Yuta Okkotsu
    members: [Authentic Mutual Love, Unlimited Void]

