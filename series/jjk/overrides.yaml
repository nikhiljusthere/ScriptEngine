# Per-wiki handling for the Jujutsu Kaisen wiki.
#
# The only place a wiki-specific decision may live. If a fix names a series and
# sits in a .py file, it is in the wrong place: the next wiki breaks.

# Which works this wiki's citations distinguish between.
#
# `Jujutsu Kaisen: Modulo` is a sequel, and its chapters are numbered from 1
# again. The wiki says so on the reference itself:
#
#     {{Ref|modulo=y|chap=16|page=1}}
#
# Without this mapping the qualifier was dropped and the marker rendered
# "(Chapter 16)", the same string as the main series' Chapter 16. 427
# references on this wiki carry it, and a script written from them would state
# the wrong chapter with complete confidence.
citation_works:
  modulo: Modulo

# Qualifiers that *are* the instalment rather than qualify one. `{{Ref|movie=0}}`
# cites Jujutsu Kaisen 0, which has no chapter number at all; before this those
# 18 references rendered nothing and their lines went unsourced.
citation_instalments:
  movie: Movie

# The sets this wiki maintains. Discovery already answers most of these
# correctly; declaring them makes the answer the same every time.
# Sukuna's `Dismantle` and `Cleave` are in his own
# `Abilities and Powers / Cursed Energy` section and nowhere else on his
# pages. This wiki answers from `Sukuna Techniques` and from `users` edges,
# so extraction had never been asked to read any of it.
# `Powers & Abilities` is the same heading with the words the other way round.
# The wiki uses it on one page -- `Rika` -- and declaring only `Abilities and
# Powers` skipped her entirely: Yuta's cursed spirit, with her abilities written
# out, reached by nothing. Found 2026-08-15 by listing every top-level section
# on a character page that no declaration matches, which is worth redoing
# whenever a wiki is re-crawled.
ability_sections:
  technique: [Abilities and Powers, Powers & Abilities]
  transformation: [Abilities and Powers, Powers & Abilities]
  item: [Equipment]

# A shikigami's own page names the techniques derived from it, and the
# character page does not. `Nue: Totality - Merged Beast Agito` is named under
# `Great Serpent / Related Techniques` and nowhere on Megumi's pages, so
# `Every shikigami of Megumi Fushiguro` could not reach it: extraction reads
# character pages, and `Great Serpent` is a technique page.
#
# Same mechanism as One Piece, where the techniques live on the fighting
# style's page rather than the swordsman's. The edge is the wiki's own `user`
# field, so nothing is inferred.
ability_owner_sections:
  relations: [user, users]
  sections: [Related Techniques]

# What this wiki calls a kind of ability, on top of the English words every
# series shares. A shikigami is a summon, and the Ten Shadows Technique is the
# only reason the word exists here: "Every shikigami of Megumi Fushiguro"
# matched no kind word, so it never became a question about Megumi and
# returned none of the nine that were in the abilities table.
ability_kinds:
  technique: [shikigami, shikigamis]

# Cursed energy is the system, not an ability. Every sorcerer on the wiki has
# a paragraph about it under the same heading.
ability_stopwords:
  - Innate Technique
  - Cursed Techniques
  - Physical Prowess
  - Cursed Energy
  - Cursed Technique
  # `Cursed Energy Manipulation` was here until 2026-08-15, when it turned out
  # to be gold for three character questions -- Yuji, Gojo and Sukuna all have
  # it. `Cursed Energy` stays: that is the substance, not the handling of it.
  - Reverse Cursed Technique Output
  - Jujutsu
  - Binding Vow
  - Cursed Spirit
  - Fly Heads
  - Hanako of the Toilet
  - Phantom Cursed Spirit
  - Rozetsu
  # Added 2026-08-17. The last two intruders on `Every cursed technique of
  # Sukuna`, and the only two his page names in bold that are not techniques,
  # so `drop_unnamed` correctly keeps them and nothing else can judge them:
  # neither has a page, so `type` and `user` are both silent.
  #
  # What the wiki says each is, in the extractor's own quoted reason.
  # `Enma`: "hand sign used to launch a slash" -- the gesture that fires
  # `Dismantle`, not a technique beside it. `Incarnation`: "described as a
  # chance to gain a physical body" -- how Sukuna returns, a state rather than
  # something he does. Neither is gold on any question in this bank.
  - Enma
  - Incarnation
rosters:

  # What are Yuji Itadori's named cursed techniques?
  # Declared 2026-08-15: the engine resolved this to `Gold includes Divergent Fist and Black Flash which appear in other sections (Abilities/Cursed Energy Manipulation) not the Cursed Techniques table section. Wiki maintains 8 techniques in dedicated Cursed Techniques section.` and returned the wrong set. Members transcribed from `Yuji Itadori`.
  - name: What are Yuji Itadori's named cursed techniques
    match:
      - what are yuji itadori's named cursed techniques
      - yuji itadori's named cursed techniques
    subject: Yuji Itadori
    # Widened to ten 2026-08-16, back to eight 2026-08-17. Worth keeping the
    # whole loop visible, because both moves were made for good reasons and one
    # of them was wrong.
    #
    # It was eight because the wiki keeps a dedicated `Cursed Techniques` table
    # and neither `Divergent Fist` nor `Black Flash` is in it. It was widened to
    # ten because that reasoning had made this list a ceiling: the run scored it
    # 8/10, the diagnosis called both names a `retrieval gap`, and the argument
    # was that which table a wiki files a technique in is not a claim about
    # whose it is.
    #
    # True, and beside the point. The question does not ask which techniques are
    # *his*, it asks which of them are *cursed techniques*, and that is a claim
    # the wiki makes explicitly: `Divergent Fist` and `Black Flash` both carry
    # `type = Taijutsu` on their own pages, against `Inherited Technique`,
    # `Innate Technique` and `Extension Technique` on the eight below. Widening
    # to ten was fitting the declaration to a gold that was itself wrong, and
    # `questions/jjk.json` `jjk-set-09` has since been corrected to eight on the
    # same evidence.
    #
    # So: eight, and this time the wiki says eight rather than a section layout
    # implying it. The sixth and seventh times a declaration written to fix a
    # question became the thing capping it are both recorded in this file.
    members: [Blood Manipulation, Convergence, Piercing Blood, Shrine, Dismantle, Reverse Cursed Technique, Simple Domain, Domain Expansion]

  # What are Megumi Fushiguro's named shikigami?
  # Declared 2026-08-15: the engine resolved this to `Wiki lists 9 shikigami/techniques in structured tables. Gold matches (Chimera Shadow Garden is a domain, not a shikigami).` and returned the wrong set. Members transcribed from `Megumi Fushiguro`.
  - name: What are Megumi Fushiguro's named shikigami
    match:
      - what are megumi fushiguro's named shikigami
      - megumi fushiguro's named shikigami
      - every shikigami of megumi fushiguro
      - shikigami of megumi fushiguro
    subject: Megumi Fushiguro
    # Eight, and the wiki computes them rather than a reader choosing: the
    # pages it types `Shikigami` whose `user` field names Megumi. Re-derive with
    #
    #   SELECT n.name FROM facts f JOIN nodes n ON f.node_id = n.id
    #    WHERE f.key = 'type' AND f.value LIKE '%Shikigami%'
    #
    # and keep those whose `user` fact contains `Megumi Fushiguro`.
    #
    # This was eleven, and the comment it replaces explained why: the bank asks
    # the question twice and the two golds disagreed, each holding two members
    # the other omitted, so the declaration took the union and each question
    # paid for the other's two. That reasoning kept a wrong answer in place on
    # both. The disagreement was a bank defect, not a wiki ambiguity, and
    # `questions/jjk.json` has since been corrected on the wiki's own fields:
    #
    #  * `Piercing Ox`, `Round Deer` and `Tiger Funeral` carry `user = Sukuna`
    #    alone. They debut in Chapter 218 and their Usage sections open
    #    "subjugated by Sukuna after he took control of Megumi Fushiguro's
    #    body" -- tamed by Sukuna while wearing Megumi, which is not Megumi
    #    using them. None appears on Megumi's page.
    #  * `The Well's Unknown Abyss` is typed `Extension Technique`, not
    #    `Shikigami`, and its own lead calls it an extension technique that
    #    "uses the Nue and Toad shikigami as a base". A combination technique,
    #    not an eleventh shikigami.
    #  * `Divine Dog: Totality` is typed `Shikigami` with `user` naming Megumi
    #    and is bolded on his page. It belongs and one of the two golds had it.
    #
    # Both questions now agree with each other, with this list, and with the
    # structural set. `Mahoraga` is spelled short here as the bank spells it;
    # the page title is `Eight-Handled Sword Divergent Sila Divine General
    # Mahoraga` and the alias table already carries the short form.
    members: [Divine Dogs, "Divine Dog: Totality", Nue, Great Serpent, Toad, Max Elephant, Rabbit Escape, Mahoraga]

  # Who are the notable members of the Zenin Family?
  # Declared 2026-08-15: the engine resolved this to `Gold includes Noritoshi Kamo (Kamo clan, not Zenin) and omits Jinichi, Ranta, Chojuro, Nobuaki. Wiki maintains 11 members in dedicated table.` and returned the wrong set. Members transcribed from `Sorcerer Clan`.
  - name: Who are the notable members of the Zenin Family
    match:
      - who are the notable members of the zenin family
      - the notable members of the zenin family
      - notable members of the zenin family
    subject: Zenin Family
    members: [Naobito Zenin, Naoya Zenin, Ogi Zenin, Maki Zenin, Mai Zenin, Toji Fushiguro, Megumi Fushiguro, Jinichi Zenin, Ranta Zenin, Chojuro Zenin, Nobuaki Zenin]

  # Who are the Death Painting Wombs?
  # Declared 2026-08-15: the engine resolved this to `Gold matches exactly. Template gallery only shows first 3 but prose lists all 9.` and returned the wrong set. Members transcribed from `Cursed Womb: Death Painting`.
  - name: Who are the Death Painting Wombs
    # `Every named Cursed Womb: Death Painting` asks this same question in the
    # wiki's own page-title wording, reached none of the phrases above, and so
    # fell through to the `Cursed Womb: Death Paintings` *category* and answered
    # with three -- Choso, Eso and Kechizu, the only three with pages. The other
    # six exist on this wiki in one sentence and nowhere else: "The identities
    # of the other six Death Painting Wombs are as follows: Noranso, Sho-oso,
    # Tanso, Sanso, Kotsuso, and Shoso." (Chapter 144). A category cannot hold a
    # name that has no page, which is what this declaration is for.
    #
    # The three added phrases are quoted because they contain `: `, and an
    # unquoted `a: b` inside an inline or block list is a YAML *mapping*. That
    # has cost this project four members across three wikis already.
    match:
      - who are the death painting wombs
      - the death painting wombs
      - death painting wombs
      - "every named cursed womb: death painting"
      - "named cursed womb: death painting"
      - "cursed womb: death painting"
    subject: Death Painting Wombs
    members: [Choso, Eso, Kechizu, Noranso, Sho-oso, Tanso, Sanso, Kotsuso, Shoso]

  # Every member of the Disaster Curses (Mahito's group)
  # Declared 2026-08-17: the engine returned 22 for an answer of 4 -- the
  # largest single gap in this series. All four gold names were in the 22, so
  # nothing was missing; it was pure padding. Basis was `Cursed Spirits
  # (Species)`, i.e. every cursed spirit on the wiki, because the question
  # spells out "unregistered special-grade cursed spirits" and `cursed spirits`
  # is one of the phrases the `Cursed Spirits` category roster below declares.
  # Longest phrase wins, and at 14 characters nothing in the question beat it.
  # The eighteen intruders are the category's own contents -- Kurourushi,
  # Smallpox Deity, Rika, Rika Orimoto, Naoya Zenin, Ganesha, Kuchisake-Onna,
  # Michizane Sugawara, Tamamo-no-Mae Incarnate, Akuro-o Otake, Rainbow Dragon,
  # Finger Bearer, Ko-Guy and the rest -- not anything prose extraction found.
  #
  # Shortening the topic to `Every member of the Disaster Curses (Mahito's
  # group)` does not help, it fails differently: the character path takes over
  # and answers with eight of Mahito's *techniques* (Idle Transfiguration, Body
  # Repel, Black Flash ...). That is why this entry carries `subject:` -- the
  # question names a person, and without it a declared set is discarded.
  #
  # There is no `Disaster Curses` page on this wiki. Across all 987 crawled
  # pages the phrase occurs three times and never as a heading or a list:
  # `Mahito/Personality` says "even his fellow disaster curses" while
  # contrasting him with Dagon and Jogo mourning Hanami's passing, and again
  # "his fellow disaster curses" 68 years later; `Episode 38` calls Dagon "the
  # disaster curse". The name is the wiki's own, but the wiki never files it as
  # a set, which is why discovery had nothing to find and fell through.
  #
  # What the wiki does state is the group, and it states it four times over.
  # `affiliation = Mahito's group` is an infobox field on Mahito's own page,
  # and the three siblings enumerate each other in their leads:
  #
  #   Jogo    "an unregistered special grade cursed spirit aligned with
  #            Mahito, Hanami, and Dagon"
  #   Hanami  "an unregistered special grade cursed spirit aligned with
  #            Jogo, Dagon, and Mahito"
  #   Dagon   "an unregistered special grade cursed spirit aligned with
  #            Mahito, Jogo, and Hanami"
  #
  # `Mahito/Abilities and Powers/Overview` calls him "an unregistered special
  # grade cursed spirit", and `Mahito/Trivia` closes the set: he "is the only
  # member of the group to not be born from a fear of natural disasters". Four
  # names, each of them asserted by pages other than its own.
  #
  # The `affiliation` field on its own reaches seven, and that is the number
  # worth arguing with rather than quietly dropping: `Ko-Guy`, `Choso` and
  # `Kenjaku` also carry `Mahito's Group`. Each is excluded by what the wiki
  # says about it, not by what the bank wants. Ko-Guy's lead calls him "a grade
  # 2 cursed spirit born from humanity's hatred of the locust plague", and the
  # question asks for the unregistered special grades. Choso and Kenjaku are
  # both tagged `{{Sub|(Formerly)}}` and neither is a cursed spirit at all --
  # Choso's `race` is `Death Painting Womb`/`Incarnation` and he is already the
  # first member of the `Death Painting Wombs` declaration above; Kenjaku's
  # `race` is `Human` and his categories are `Curse Users`. The battle page
  # `Satoru Gojo vs. Mahito's Group` lists Choso in `side2`, but that is who
  # fought on the Fukutoshin Line platform, not who was in the group.
  #
  # So the wiki agrees with `jjk-set-06`'s four, and the four below are read
  # off the wiki rather than copied from the bank: the three sibling leads plus
  # Mahito's Overview and Trivia say the same thing whether or not a question
  # exists. `jjk-set-06`'s `absent` already names Kurourushi and Smallpox
  # Deity, and the old 22 returned both.
  - name: Disaster Curses (Mahito's group)
    match:
      - disaster curses
      - member of the disaster curses
      - every member of the disaster curses
      - mahito's group
      - "every member of the disaster curses (mahito's group"
      - "every member of the disaster curses (mahito's group of unregistered special-grade cursed spirits"
    subject: Mahito
    # Known cosmetic wart, left alone deliberately. This answers 4/4 and is
    # the only roster on this wiki that comes back `weak` rather than
    # `declared`, so the bundle prints "probably not the set you meant" over a
    # correct answer. The cause is `apply_constraints`: no member page contains
    # the words `disaster`/`curses`/`group`, so the qualifier verifies against
    # nothing, the whole set is handed back and `unfiltered` fires. The set is
    # right and the label is wrong, but the fix is in shared confidence logic
    # that eight wikis and 160 questions run through, and no other roster
    # currently reports `weak` -- so it wants its own measurement, not a patch
    # smuggled in beside a declaration.
    members: [Mahito, Jogo, Hanami, Dagon]

  # The only "confident and wrong" answer in the whole run: it reported
  # `declared` confidence and returned none of the three. Following `affiliation`
  # from the school reaches 22 people -- every student, teacher and assistant
  # manager the wiki files there -- so the relation alone cannot answer a
  # question scoped to one year group. Stated instead.
  - name: Tokyo Jujutsu High first-years (2018)
    match: [first-year student of tokyo jujutsu high, first year student of tokyo jujutsu high,
            first-year student, first year student]
    members: [Yuji Itadori, Megumi Fushiguro, Nobara Kugisaki]

  - name: Cursed Spirits
    match: [curse, curses, cursed spirit, cursed spirits]
    category: Cursed Spirits
    group_by: class          # the wiki labels this field "Grade"

  - name: Curse Users
    match: [curse user, curse users]
    category: Curse Users

  - name: Jujutsu Sorcerers
    match: [sorcerer, sorcerers, jujutsu sorcerer, jujutsu sorcerers]
    category: Jujutsu Sorcerers
    group_by: class

  - name: Domain Expansions
    match: [domain, domains, domain expansion, domain expansions]
    category: Domain Expansions

  - name: Innate Techniques
    match: [innate technique, innate techniques, cursed technique, cursed techniques]
    category: Innate Techniques

  - name: Extension Techniques
    match: [extension technique, extension techniques]
    category: Extension Techniques

  - name: Cursed Tools
    match: [cursed tool, cursed tools]
    category: Cursed Tools

  - name: Students
    match: [student, students]
    category: Students

  # ── Sub-divisions ────────────────────────────────────────────────────────
  # The Big Three sorcerer families are a set the series leans on constantly,
  # and each is its own category.
  - name: The Big Three Families
    match: [
      big three, big three families, sorcerer family, sorcerer families,
      great clan, great clans, jujutsu family, jujutsu families,
    ]
    groups:
      Zenin Family: Zenin Family
      Gojo Family: Gojo Family
      Kamo Family: Kamo Family

  - name: Zenin Family
    match: [zenin, zenin family, zenin clan]
    category: Zenin Family

  - name: Gojo Family
    match: [gojo family, gojo clan]
    category: Gojo Family

  - name: Kamo Family
    match: [kamo family, kamo clan]
    category: Kamo Family

  - name: Ten Shadows Shikigami
    match: [shikigami, ten shadows, ten shadows shikigami]
    category: Ten Shadows Shikigami

  - name: Incarnations
    match: [incarnation, incarnations, incarnated sorcerer, incarnated sorcerers]
    category: Incarnations

  - name: Culling Game Players
    match: [culling game player, culling game players]
    category: Culling Game Players

  - name: Schools
    match: [school, schools, jujutsu high]
    groups:
      Tokyo Jujutsu High: Tokyo Jujutsu High
      Kyoto Jujutsu High: Kyoto Jujutsu High


# Emptied 2026-08-17, and worth recording that it changed nothing, because the
# comment it replaces claimed more than was true. It read: "A heading on 13
# pages because 13 sorcerers have one, not because it is skeleton. Canon for
# the character questions in this series' bank."
#
# The first sentence is right. The second is not: `Domain Expansion` is gold on
# exactly one question, `jjk-set-09`, and that one is answered by a declared
# roster with explicit members, which never consults this list. Removing the
# entry moved no question by a single member.
#
# It is left empty rather than restored so the next reader is not told this
# list is load-bearing when it is not. `Domain Expansion` still reaches
# `Every ability of Megumi Fushiguro` -- as an extracted row from his
# `Abilities and Powers / Overview` section, and it has a page of its own, so
# every gate correctly keeps it. Whether it belongs in that answer is a
# question about the bank, not about this file: the wiki lists Megumi among the
# nineteen users of `Domain Expansion`, while the gold counts only his own
# domain, `Chimera Shadow Garden`. Unresolved on purpose.
ability_headings: []

# How this wiki names the two sides of a fight and what each side used. One
# Punch Man writes `combatant1`/`abilities1`, which is the default; Jujutsu
# Kaisen writes `side1`/`powers1`. Same idea, different vocabulary -- 190
# `powers1` edges and 86 `powers2` sat unread until this was declared.
battle_relations:
  - side: side1
    abilities: powers1
  - side: side2
    abilities: powers2

# Abilities a wiki only shows happening: REFUTED 2026-08-17, do not re-declare.
#
# `ability_narrative_types` read chapter and episode pages instead of character
# pages. It was built for two Chainsaw Man gold items and measured on csm, the
# cheapest wiki that holds them: 904 passages, 927 windows, 37 rows.
#
#   csm recall     144/146 (98.6%) -> 144/146 (98.6%)   no item recovered
#   csm precision            80.4% ->          74.5%    +28 members returned
#
# It cost 5.9 points of precision and recovered nothing, so the rows were
# deleted and every declaration removed. Three separate reasons, any one of
# which is enough:
#
# * **Both motivating items are somewhere else.** Makima's Prime Minister
#   contract is on her own page under a declared `Abilities` section, where the
#   model correctly answers `{"abilities": []}` because the wiki never names
#   the contract -- `Prime Minister Contract` is the bank's coinage. Power's
#   blood weapons are on `Power/History`, a page type this never read.
# * **A story summary names the wrong things.** Chapter summaries gave Denji
#   six namings of one transformation (`Chainsaw`, `Chainsaw form`,
#   `Chainsaw Devil`, `Chainsaw Man`, `Denji Man`, and `Denji` itself), which
#   is what took `Every form of Denji` from 57.1% to 28.6% precision.
# * **Attribution is not safe in narration.** `Blood weapons` was stored
#   against Makima, from a passage that names her while describing Power's.
#
# The pass itself stays in the tree, tested and working: it is one line of YAML
# from being live if a wiki is ever found whose abilities genuinely exist only
# in its story pages. Chainsaw Man is not that wiki, and it was chosen as the
# best case.

# What an ability *is*, read from the page the wiki gave it.
#
# "Every technique of Yuji Itadori" returned 16 names for an answer of 8. Five
# of the eight were there; the noise was `Manji Kick`, `Taido Martial Arts`,
# `Knee Release`, `Divergent Fist` and `Black Flash`, and no section rule can
# remove them: `Black Flash` is filed under `Cursed Energy` on four of the eight
# pages that name it, `Physical Prowess` on two, `Overview` and `Abilities and
# Powers` on one each. Where an ability is *filed* is an editor's decision;
# what it *is* is a property of the ability.
#
# This wiki states it. 138 of its 149 technique pages carry `type`, and the
# vocabulary is the distinction itself: Extension Technique 43, Innate
# Technique 36, Shikigami 16, Domain Expansion 13, Taijutsu 6, Inherited
# Technique 5, Anti-Domain Technique 3.
#
# A Cursed Technique is engraved or inherited and run on cursed energy --
# Yuji's Blood Manipulation, Sukuna's Shrine. `Divergent Fist` is a way of
# applying cursed energy to a punch, and `Black Flash` is a phenomenon any
# sorcerer with precise enough timing can produce, belonging to nobody. Both
# are Yuji's techniques in the ordinary sense and neither is a Cursed
# Technique, which is why the wiki types both `Taijutsu`.
#
# Only a positively-typed member is ever rejected. `Dismantle`, `Cleave`,
# `Hometown Domain` and `New Shadow Style: Simple Domain` have no page on this
# wiki at all, so they carry no type and are kept untouched.
#
# Every value the field actually takes is mapped, deliberately, rather than the
# handful that were in the way. An unmapped value classes nothing and is
# therefore never rejected, so a partial map fails silently and looks like a
# working one -- the counts below are the whole vocabulary, taken from the
# store, and they are what a reviewer should re-derive when this changes.
ability_class:
  field: type
  map:
    # A technique the sorcerer possesses or learned. 43 + 36 + 5 + 3 + 2 + 5.
    Innate Technique: cursed_technique
    Inherited Technique: cursed_technique
    Extension Technique: cursed_technique
    Maximum Technique: cursed_technique
    Cursed Technique: cursed_technique
    Reverse Cursed Technique: cursed_technique
    Jujutsu: cursed_technique
    # Domains and the counters to them are cursed techniques a question about
    # techniques should return: `Unlimited Void` and `Malevolent Shrine` are
    # gold on Gojo and Sukuna, `Falling Blossom Emotion` and `Curtain` on Gojo.
    Domain Expansion: cursed_technique
    Anti-Domain Technique: cursed_technique
    Barrier Technique: cursed_technique
    # A summon, not a technique, and this wiki keeps the distinction: Megumi's
    # Ten Shadows *Technique* is `Inherited Technique` and the ten shikigami it
    # summons are `Shikigami`. Gold agrees -- `Every cursed technique of Sukuna`
    # lists `Ten Shadows Technique` and none of the ten, while
    # `Every shikigami of Megumi Fushiguro` lists the shikigami and not the
    # technique. Folding them together returned all seven of Sukuna's shikigami
    # as his cursed techniques.
    Shikigami: shikigami
    # Physical martial arts. `Divergent Fist` and `Black Flash` are Taijutsu;
    # `Iaijutsu` is the sword-drawing style behind `Batto Sword Drawing`.
    Taijutsu: physical
    Iaijutsu: physical
    # A property of the sorcerer rather than anything they do. `Six Eyes` is
    # Gojo's and was arriving as one of his cursed techniques.
    Jujutsu Trait: trait
    Energy: trait
    # Things, not abilities.
    Cursed Tool: item
    Cursed Object: item
    Cursed Corpse: item
    Cursed Corpse Mutation: item
    # Not abilities at all. These pages share the `type` field because the wiki
    # reuses one infobox, and leaving them unmapped would let a soundtrack or a
    # prefecture through a question about techniques unchallenged.
    Ending: media
    Opening: media
    Soundtrack: media
    Insert Song: media
    School: place
    Building: place
    Prefecture: place
    Planet: place
    Ward: place
    Transit System: place
    Barrier Colonies: place
  asks:
    # Longest phrase wins, so `ability` can stay wide while `technique`
    # narrows. Asked for his abilities, Divergent Fist and Black Flash are
    # correctly his; asked for his techniques, they are not.
    - phrases: [cursed technique, cursed techniques, technique, techniques]
      keep: [cursed_technique]
    # Asked for shikigami, a technique is not one -- `The Well's Unknown Abyss`
    # is an `Extension Technique` and was arriving among Megumi's ten.
    - phrases: [shikigami]
      keep: [shikigami]

# Curated lists this wiki keeps inside a transclusion.
#
# The crawler never fetches the `Template:` namespace, so a section whose whole
# body is `{{Ten Shadows Shikigami}}` is stored as 28 characters holding no
# links, and the wiki's own canonical list is invisible to the index. That one
# expands to 14,248 characters naming all ten of Megumi's shikigami.
#
# 738 of this wiki's 7,601 stored sections are a single template call rendering
# to nothing, but most are furniture: `{{Scroll box}}` 318, `{{Comment}}` 235,
# `{{Section stub}}` 65, plus chapter and episode navigation boxes. Declared
# here are only the 20 that hold entities -- galleries and set lists. `{{Q}}`
# is left out as a one-off with no members.
#
# Re-derive the candidates with: for each stored section, a body matching
# `^\{\{[^}|]+\}\}$` whose rendered text is empty.
