    members: [Yuji Itadori, Panda, Nobara Kugisaki, Cross Val Vol Yelvori, Marulu Val Vol Yelvori, Dapa, Osuki, Yuka Okkotsu, Tsurugi Okkotsu, Mifuyu Okkotsu, Yuta Okkotsu, Maki Zenin, Iori Okkotsu, Choso, Wasuke Itadori, Aoi Todo, Tengen, Megumi Fushiguro, Kou Usami, Jabaloma, Satoru Gojo, Dabura Karaba, Ui Ui, Kyoko Tomoe]
ability_headings: []

# How this wiki names the two sides of a fight and what each side used. One
# Punch Man writes `combatant1`/`abilities1`, which is the default; Jujutsu
# Kaisen writes `side1`/`powers1`. Same idea, different vocabulary -- 190
# `powers1` edges and 86 `powers2` sat unread until this was declared.
battle_relations:
  - side: side1
    abilities: powers1
  - side: side2
    abilities: powers2

# A character's battle pages may list the combatant under a name the page's
# own alias set never carries: the JJK wiki keeps the Angel (the incarnation)
# and Hana Kurusu (the body she possesses) on separate pages, and both of
# her battle pages list `Hana Kurusu` in `side1`. Neither `Angel` nor
# `Tenshi` appears on a side, so the battles-in search for the Angel would
# come up empty without this declared bridge.
battle_aliases:
  Angel:
    - Hana Kurusu

# Abilities a wiki only shows happening: REFUTED 2026-08-17, do not re-declare.
#
# `ability_narrative_types` read chapter and episode pages instead of character
# pages. It was built for two Chainsaw Man gold items and measured on csm, the
# cheapest wiki that holds them: 904 passages, 927 windows, 37 rows.
#
#   csm recall     144/146 (98.6%) -> 144/146 (98.6%)   no item recovered
#   csm precision            80.4% ->          74.5%    +28 members returned
#
# It cost 5.9 points of precision and recovered nothing, so the rows were
# deleted and every declaration removed. Three separate reasons, any one of
# which is enough:
#
# * **Both motivating items are somewhere else.** Makima's Prime Minister
#   contract is on her own page under a declared `Abilities` section, where the
#   model correctly answers `{"abilities": []}` because the wiki never names
#   the contract -- `Prime Minister Contract` is the bank's coinage. Power's
#   blood weapons are on `Power/History`, a page type this never read.
# * **A story summary names the wrong things.** Chapter summaries gave Denji
#   six namings of one transformation (`Chainsaw`, `Chainsaw form`,
#   `Chainsaw Devil`, `Chainsaw Man`, `Denji Man`, and `Denji` itself), which
#   is what took `Every form of Denji` from 57.1% to 28.6% precision.
# * **Attribution is not safe in narration.** `Blood weapons` was stored
#   against Makima, from a passage that names her while describing Power's.
#
# The pass itself stays in the tree, tested and working: it is one line of YAML
# from being live if a wiki is ever found whose abilities genuinely exist only
# in its story pages. Chainsaw Man is not that wiki, and it was chosen as the
# best case.

# What an ability *is*, read from the page the wiki gave it.
#
# "Every technique of Yuji Itadori" returned 16 names for an answer of 8. Five
# of the eight were there; the noise was `Manji Kick`, `Taido Martial Arts`,
# `Knee Release`, `Divergent Fist` and `Black Flash`, and no section rule can
# remove them: `Black Flash` is filed under `Cursed Energy` on four of the eight
# pages that name it, `Physical Prowess` on two, `Overview` and `Abilities and
# Powers` on one each. Where an ability is *filed* is an editor's decision;
# what it *is* is a property of the ability.
#
# This wiki states it. 138 of its 149 technique pages carry `type`, and the
# vocabulary is the distinction itself: Extension Technique 43, Innate
# Technique 36, Shikigami 16, Domain Expansion 13, Taijutsu 6, Inherited
# Technique 5, Anti-Domain Technique 3.
#
# A Cursed Technique is engraved or inherited and run on cursed energy --
# Yuji's Blood Manipulation, Sukuna's Shrine. `Divergent Fist` is a way of
# applying cursed energy to a punch, and `Black Flash` is a phenomenon any
# sorcerer with precise enough timing can produce, belonging to nobody. Both
# are Yuji's techniques in the ordinary sense and neither is a Cursed
# Technique, which is why the wiki types both `Taijutsu`.
#
# Only a positively-typed member is ever rejected. `Dismantle`, `Cleave`,
# `Hometown Domain` and `New Shadow Style: Simple Domain` have no page on this
# wiki at all, so they carry no type and are kept untouched.
#
# Counting must be category-aware (the owner's specification). The wiki's
# `user` field describes *who can use or possess* something; it does not define
# *what category that thing belongs to*. So the classes below split what this
# wiki used to fold into one bucket: an Extension Technique, a Domain Expansion,
# an Anti-Domain and a Barrier are applications of a cursed technique, not
# techniques in their own right. `Every cursed technique of Satoru Gojo` is now
# **Limitless** (Infinity is part of it; Blue/Red/Purple are applications;
# Unlimited Void is his domain), and Nobara has one: Straw Doll Technique.
#
# Every value the field actually takes is mapped, deliberately, rather than the
# handful that were in the way. An unmapped value classes nothing and is
# therefore never rejected, so a partial map fails silently and looks like a
# working one -- re-derive the vocabulary from the store when this changes.
ability_class:
  field: type
  map:
    # A technique engraved or inherited and run on cursed energy. The only class
    # that answers "cursed technique". `Innate`/`Inherited Technique` are the
    # two ways a sorcerer comes by one; plain `Jujutsu` is the wiki's catch-all
    # for the same thing.
    Innate Technique: cursed_technique
    Inherited Technique: cursed_technique
    Jujutsu: cursed_technique
    # An application of a technique, not a technique. Blue/Red/Purple are how
    # Gojo runs Limitless; they were arriving as his cursed techniques and are
    # not ones he possesses. `Maximum Technique` is the same for its owner.
    Extension Technique: extension
    Maximum Technique: extension
    # A domain is a separate category, and so are the counters to one.
    Domain Expansion: domain
    Anti-Domain Technique: jujutsu_ability
    Barrier Technique: jujutsu_ability
    # The wiki's own catch-all label for a jujutsu ability that is not an
    # engraved technique: `Cursed Technique` as a type, and the general-purpose
    # moves below it.
    Cursed Technique: jujutsu_ability
    # One deliberate override of the wiki, and the only line in this file that
    # contradicts it rather than reading it. `Reverse Cursed Technique` carries
    # `type = Cursed Technique` on its page, but it is a general-purpose ability
    # any sorcerer can learn -- not an engraved technique anyone possesses -- so
    # it is classed as a jujutsu ability and does not answer "cursed technique".
    Reverse Cursed Technique: jujutsu_ability
    # A summon, not a technique. Megumi's Ten Shadows *Technique* is `Inherited
    # Technique` and the shikigami it summons are `Shikigami`; folding them
    # together returned all seven of Sukuna's shikigami as his cursed techniques.
    Shikigami: shikigami
    # Physical martial arts. `Divergent Fist` and `Black Flash` are Taijutsu;
    # `Iaijutsu` is the sword-drawing style behind `Batto Sword Drawing`.
    Taijutsu: physical
    Iaijutsu: physical
    # A property of the sorcerer rather than anything they do. `Six Eyes` is
    # Gojo's and was arriving as one of his cursed techniques.
    Jujutsu Trait: trait
    Energy: trait
    # Things, not abilities.
    Cursed Tool: item
    Cursed Object: item
    Cursed Corpse: item
    Cursed Corpse Mutation: item
    # Not abilities at all. These pages share the `type` field because the wiki
    # reuses one infobox, and leaving them unmapped would let a soundtrack or a
    # prefecture through a question about techniques unchallenged.
    Ending: media
    Opening: media
    Soundtrack: media
    Insert Song: media
    School: place
    Building: place
    Prefecture: place
    Planet: place
    Ward: place
    Transit System: place
    Barrier Colonies: place
  asks:
    # Longest phrase wins, so `ability` can stay wide while the narrower words
    # narrow. Asked for his abilities, Divergent Fist and Black Flash are
    # correctly his; asked for his cursed techniques, they are not -- and neither
    # is Blue, an application of Limitless rather than a technique he possesses.
    - phrases: [cursed technique, cursed techniques]
      keep: [cursed_technique]
    # `technique` alone stays wide on purpose: it is the word inside "Ten Shadows
    # Technique" and "Shikigami Technique", both of which are gold as techniques.
    # Declaring nothing for a bare `technique` keeps those reachable while
    # `cursed technique` (the longer phrase) narrows to the engraved ones.
    - phrases: [shikigami]
      keep: [shikigami]
    - phrases: [domain expansion, domain expansions]
      keep: [domain]

# Curated lists this wiki keeps inside a transclusion.
#
# The crawler never fetches the `Template:` namespace, so a section whose whole
# body is `{{Ten Shadows Shikigami}}` is stored as 28 characters holding no
# links, and the wiki's own canonical list is invisible to the index. That one
# expands to 14,248 characters naming all ten of Megumi's shikigami.
#
# 738 of this wiki's 7,601 stored sections are a single template call rendering
# to nothing, but most are furniture: `{{Scroll box}}` 318, `{{Comment}}` 235,
# `{{Section stub}}` 65, plus chapter and episode navigation boxes. Declared
# here are only the 20 that hold entities -- galleries and set lists. `{{Q}}`
# is left out as a one-off with no members.
#
# Re-derive the candidates with: for each stored section, a body matching
# `^\{\{[^}|]+\}\}$` whose rendered text is empty.
template_lists:
  - Ten Shadows Shikigami
  - Shikigami
  - Death Painting Wombs Gallery
  - Cursed Wombs
  - Domain Expansions
  - Cursed Tools
  - Cursed Objects
  - Cursed Corpses
  - Cursed Victims
  - Cursed Spirit Manipulation
  - Cursed Spirits Gallery
  - Curse Users Gallery
  - Culling Game Players Gallery
  - Jujutsu Sorcerers Gallery
  - Tokyo Jujutsu High Gallery
  - Kyoto Jujutsu High Gallery
  - Simuria Gallery
  - Gachinko Fight Club
  - Time Vessel Association
  - Shibuya Incident Timeline

# Facts the extractor cannot derive: they hold only inside a story window
# (an interval state), while the infobox states the entity's current state.
# The builder upserts them after the graph load (node by name), so a re-index
# recreates them; each (node, key) is replaced, never appended.
#
# Without these, a question about a character's state *during the Culling
# Game* is answered with the infobox's current state (the P4 4A oracle
# S-group, plan/ORACLE_v2.yaml): Nanami reads as "Deceased" with no window,
# Gojo as "Sealed" with no start point.
extra_facts:
  - node: Kento Nanami
    key: state_during_culling_game
    label: State during the Culling Game
    value: "Deceased (killed by Mahito during the Shibuya Incident — 'Mahito then kills Nanami')"
    citation: "Pin 'Mahito then kills Nanami' (Shibuya Incident Arc, Right and Wrong)"
  - node: Satoru Gojo
    key: state_at_start_of_culling_game
    label: State at the start of the Culling Game
    value: "Alive but sealed ('With Satoru Gojo sealed and Geto's motives unknown')"
    citation: "Pin 'With Satoru Gojo sealed and Geto's motives unknown' (Culling Game Arc, Synopsis)"

