  # nickname for him. `Gojō Satoru` is the romaji of his name, not an alias.
  - name: Satoru Gojo's aliases
    match: [all the aliases of satoru gojo, aliases of satoru gojo, satoru gojo's aliases]
    subject: Satoru Gojo
    members: ["The Strongest", "Blindfolded Idiot (By Maki)"]

  # What are all the cursed techniques of Satoru Gojo?
  # Declared 2026-08-20 for the page campaign (`jjk-pg-gojo-003`).
  # Without a declaration the query lands on the derived `Satoru Gojo
  # Techniques (Derived Technique)` roster, which mixes applications
  # (Maximum Cursed Energy Output), the barrier (Curtain), the anti-domain
  # (New Shadow Style: Simple Domain), the neutral form (Infinity) and the
  # inherited technique itself. Following the ability_class contract
  # (overrides L727+), a cursed technique is engraved or inherited: only
  # Limitless answers. Blue/Red/Purple are extensions of it, Unlimited Void
  # is his domain, Six Eyes is a trait.
  - name: Every cursed technique of Satoru Gojo
    match: [every cursed technique of satoru gojo, all the cursed techniques of satoru gojo, cursed techniques of satoru gojo]
    subject: Satoru Gojo
    members: [Limitless]

  # What are all the domain expansions of Satoru Gojo?
  # Declared 2026-08-20 for the page campaign (`jjk-pg-gojo-004`).
  # Without a declaration the wh-question routes to `qa` ("a question about a
  # character") because no declared phrase claims the topic, and the prose
  # answer cannot enumerate a set. `Unlimited Void` is the only domain the
  # wiki types `Domain Expansion` with Gojo as user.
  - name: Every domain expansion of Satoru Gojo
    match: [every domain expansion of satoru gojo, all the domain expansions of satoru gojo, domain expansions of satoru gojo]
    subject: Satoru Gojo
    members: [Unlimited Void]

  # What are all the cursed techniques of Yuta Okkotsu?
  # Declared 2026-08-20 for the page campaign (`jjk-pg-yuta-002`).
  # Same shape as Gojo's declaration: undeclared, the query lands on the
  # derived `Yuta Okkotsu Techniques (Derived Technique)` roster, which mixes
